                                        {['participants', 'presents', 'valides'].map(cle => <td key={cle} className="centre"><input type="checkbox" aria-label={`${c.nom} ${cle}`} style={{ width: 17, height: 17, accentColor: 'var(--accent)' }} checked={(edition[cle] || []).includes(c.id)} onChange={() => basculer(cle, c.id)} /></td>)}
                                    </tr>)}</tbody>
                                </table></div>
                            </> : <p style={{ color: 'var(--encre-3)', fontSize: 13 }}>Aucun conseiller enregistré sur cette activité.</p>}
                            {!nominatif && <>
                                <p style={{ color: 'var(--encre-3)', fontSize: 12, margin: '10px 0 6px' }}>Sans liste nominative, tu peux saisir uniquement les effectifs :</p>
                                <div className="grille">
                                    <Champ libelle="Inscrits"><input className="input" type="number" min="0" value={edition.nbPrevus} onChange={e => setEdition({ ...edition, nbPrevus: e.target.value })} /></Champ>
                                    <Champ libelle="Présents"><input className="input" type="number" min="0" value={edition.nbPresents} onChange={e => setEdition({ ...edition, nbPresents: e.target.value })} /></Champ>
                                    <Champ libelle="Acquis validés"><input className="input" type="number" min="0" value={edition.nbValides} onChange={e => setEdition({ ...edition, nbValides: e.target.value })} /></Champ>
                                </div>
                            </>}
                            <Champ libelle="Commentaire / bilan"><textarea className="input" value={edition.commentaire || ''} onChange={e => setEdition({ ...edition, commentaire: e.target.value })}></textarea></Champ>
                        </fieldset>
                        <div className="modal-pied">
                            <div>{peutEditer && edition.id && <button className="btn danger" onClick={async () => { if (confirm('Supprimer cette session ?')) { await sessionsCol.supprimer(edition.id); setEdition(null); } }}>Supprimer</button>}</div>
                            <div className="actions"><button className="btn" onClick={() => setEdition(null)}>Fermer</button>{peutEditer && <button className="btn primaire" onClick={enregistrer}>Enregistrer</button>}</div>
                        </div>
                    </Modal>}
                </>
            );
        }

        // --- ACCOMPAGNEMENT TERRAIN ---
        function VueAccompagnement({ ctx }) {
            const { ref, peutEditer, fAccs, accs, accsCol, fConseillers, conseillers, parId, niveauActuel } = ctx;
            const [edition, setEdition] = useState(null);
            const vide = { conseillerId: '', date: aujourdhui(), type: TYPES_ACC[0], competence: '', statut: 'Réalisé', niveauAvant: '', niveauApres: '', action: '', avecEcoute: false, nbAppels: '', refAppel: '', echeance: '', commentaire: '' };
            const choisis = trier(conseillers.filter(c => c.statut !== 'Sorti' || c.id === edition?.conseillerId), 'nom');
            const maj = (champs) => {
                const suiv = { ...edition, ...champs };
                // Pré-remplit le niveau "avant" avec le niveau actuel connu du conseiller
                if (!edition.id && ('conseillerId' in champs || 'competence' in champs) && suiv.conseillerId && suiv.competence && parId[suiv.conseillerId]) {
                    suiv.niveauAvant = niveauActuel(parId[suiv.conseillerId], suiv.competence) || '';
                }
                setEdition(suiv);
            };
            const enregistrer = async () => {
                const d = { ...edition, niveauAvant: +edition.niveauAvant || '', niveauApres: +edition.niveauApres || '' };
                if (!d.conseillerId) return alert('Choisis un conseiller.');
                if (!d.competence) return alert('Choisis la compétence travaillée.');
                if (!d.date) return alert('La date est obligatoire.');
                // Pas de doublon : une seule ligne par conseiller, par compétence et par jour
                const doublon = accs.find(a => a.id !== d.id && a.conseillerId === d.conseillerId && a.competence === d.competence && a.date === d.date);
                if (doublon) return alert(`Une action existe déjà pour ${parId[d.conseillerId].nom} sur « ${d.competence} » le ${fmtDate(d.date)}. Modifie la ligne existante au lieu d'en créer une seconde.`);
                if (!d.avecEcoute) { d.nbAppels = ''; d.refAppel = ''; }
                const { id, ...data } = d;
                try { if (id) await accsCol.modifier(id, data); else await accsCol.ajouter(data); setEdition(null); } catch (e) { alert('Enregistrement impossible : ' + e.message); }
            };
            const exporter = () => exporterCSV('Accompagnement_GRC', ['Date', 'Conseiller', 'Activité', 'Équipe', 'Type', 'Compétence travaillée', 'Statut', 'Niveau avant', 'Niveau après', 'Évolution', 'Avec écoute', "Nb d'appels écoutés", 'Référence appel', 'Action convenue', 'Prochain point', 'Commentaire'],
                fAccs.map(a => { const c = parId[a.conseillerId] || {}; return [fmtDate(a.date), c.nom, c.activite, c.equipe, a.type, a.competence, a.statut, a.niveauAvant, a.niveauApres, a.niveauAvant && a.niveauApres ? a.niveauApres - a.niveauAvant : '', a.avecEcoute ? 'Oui' : 'Non', a.nbAppels, a.refAppel, a.action, fmtDate(a.echeance), a.commentaire]; }));
            const historique = edition && edition.conseillerId ? trier(accs.filter(a => a.conseillerId === edition.conseillerId && a.id !== edition.id), 'date').reverse().slice(0, 5) : [];

            return (
                <>
                    <div className="actions" style={{ marginBottom: 14 }}>
                        <span style={{ flex: 1 }}></span>
                        <button className="btn" onClick={exporter}><Icone nom="telecharger" taille={15} /> Exporter</button>
                        {peutEditer && <button className="btn primaire" onClick={() => setEdition({ ...vide, conseillerId: fConseillers.length === 1 ? fConseillers[0].id : '' })}><Icone nom="plus" taille={15} /> Action d'accompagnement</button>}
                    </div>
                    <div className="carte"><div className="tab-wrap"><table className="tab">
                        <thead><tr><th>Date</th><th>Conseiller</th><th>Compétence travaillée</th><th>Type</th><th>Statut</th><th className="centre">Avant</th><th className="centre">Après</th><th>Action convenue</th><th>Prochain point</th><th></th></tr></thead>
                        <tbody>
                            {[...fAccs].reverse().map(a => { const c = parId[a.conseillerId] || {}; return <tr key={a.id}>
                                <td style={{ whiteSpace: 'nowrap' }}>{fmtDate(a.date)}</td>
                                <td><b>{c.nom || 'Conseiller supprimé'}</b><div style={{ fontSize: 11, color: 'var(--encre-3)' }}>{c.activite}{c.equipe ? ' · ' + c.equipe : ''}</div></td>
                                <td>{a.competence}</td><td>{a.type}{a.avecEcoute && <span className="badge" style={{ marginLeft: 6 }}>Écoute</span>}</td><td><BadgeStatut s={a.statut} /></td>
                                <td className="centre"><Niveau v={+a.niveauAvant} /></td><td className="centre"><Niveau v={+a.niveauApres} />{a.niveauAvant && a.niveauApres && +a.niveauApres > +a.niveauAvant ? <span style={{ fontSize: 10, marginLeft: 2 }}>▲</span> : null}</td>
                                <td style={{ maxWidth: 260 }}>{a.action}</td><td style={{ whiteSpace: 'nowrap' }}>{fmtDate(a.echeance) || '—'}</td>
                                <td className="num"><button className="btn mini" onClick={() => setEdition({ ...vide, ...a })}>{peutEditer ? 'Modifier' : 'Voir'}</button></td>
                            </tr>; })}
                            {fAccs.length === 0 && <tr><td colSpan="10" className="vide">Aucune action d'accompagnement sur ces filtres.</td></tr>}
                        </tbody>
                    </table></div></div>

                    {edition && <Modal titre={edition.id ? "Action d'accompagnement" : "Nouvelle action d'accompagnement"} onFermer={() => setEdition(null)}>
                        <fieldset disabled={!peutEditer} style={{ border: 0, padding: 0, margin: 0 }}>
                            <div className="grille">
                                <Champ libelle="Conseiller" classe="pleine"><Choix valeur={edition.conseillerId} onChange={v => maj({ conseillerId: v })} options={choisis.map(c => ({ v: c.id, lib: `${c.nom} · ${c.activite}${c.equipe ? ' · ' + c.equipe : ''}` }))} vide="Choisir…" /></Champ>
                                <Champ libelle="Compétence travaillée"><Choix valeur={edition.competence} onChange={v => maj({ competence: v })} options={ref.competences} vide="Choisir…" /></Champ>
                                <Champ libelle="Date"><input className="input" type="date" value={edition.date} onChange={e => maj({ date: e.target.value })} /></Champ>
                                <Champ libelle="Type"><Choix valeur={edition.type} onChange={v => maj({ type: v, avecEcoute: v === 'Écoute + débrief' ? true : edition.avecEcoute })} options={TYPES_ACC} /></Champ>
                                <Champ libelle="Statut"><Choix valeur={edition.statut} onChange={v => maj({ statut: v })} options={STATUTS_ACC} /></Champ>
                                <Champ libelle="Niveau avant"><Choix valeur={edition.niveauAvant} onChange={v => maj({ niveauAvant: v })} options={NIVEAUX.map(n => ({ v: n.v, lib: `${n.v} · ${n.lib}` }))} vide="Non évalué" /></Champ>
                                <Champ libelle="Niveau après"><Choix valeur={edition.niveauApres} onChange={v => maj({ niveauApres: v })} options={NIVEAUX.map(n => ({ v: n.v, lib: `${n.v} · ${n.lib}` }))} vide="Non évalué" /></Champ>
                                <Champ libelle="Action convenue avec le conseiller" classe="pleine"><textarea className="input" value={edition.action} onChange={e => maj({ action: e.target.value })}></textarea></Champ>
                                <Champ libelle="Prochain point de suivi"><input className="input" type="date" value={edition.echeance} onChange={e => maj({ echeance: e.target.value })} /></Champ>
                            </div>
                            <label className="coche" style={{ margin: '4px 0 10px' }}><input type="checkbox" checked={!!edition.avecEcoute} onChange={e => maj({ avecEcoute: e.target.checked })} /> Cette action s'appuie sur une écoute d'appels (facultatif)</label>
                            {edition.avecEcoute && <div className="grille">
                                <Champ libelle="Nombre d'appels écoutés"><input className="input" type="number" min="0" value={edition.nbAppels} onChange={e => maj({ nbAppels: e.target.value })} /></Champ>
                                <Champ libelle="Référence des appels"><input className="input" value={edition.refAppel} onChange={e => maj({ refAppel: e.target.value })} /></Champ>
                            </div>}
                            <Champ libelle="Commentaire"><textarea className="input" value={edition.commentaire || ''} onChange={e => maj({ commentaire: e.target.value })}></textarea></Champ>
                        </fieldset>
                        {historique.length > 0 && <>
                            <div className="sec">Dernières actions pour ce conseiller</div>
                            <table className="tab"><tbody>{historique.map(h => <tr key={h.id}><td style={{ width: 90 }}>{fmtDate(h.date)}</td><td>{h.competence}</td><td><BadgeStatut s={h.statut} /></td><td className="centre"><Niveau v={+h.niveauAvant} /> → <Niveau v={+h.niveauApres} /></td></tr>)}</tbody></table>
                        </>}
                        <div className="modal-pied">
                            <div>{peutEditer && edition.id && <button className="btn danger" onClick={async () => { if (confirm('Supprimer cette action ?')) { await accsCol.supprimer(edition.id); setEdition(null); } }}>Supprimer</button>}</div>
                            <div className="actions"><button className="btn" onClick={() => setEdition(null)}>Fermer</button>{peutEditer && <button className="btn primaire" onClick={enregistrer}>Enregistrer</button>}</div>
                        </div>
                    </Modal>}
                </>
            );
        }

        // --- PLANNING ---
        function VuePlanning({ ctx }) {
            const { fSessions, fAccs, parId, conflits, setVue } = ctx;
            const [lundi, setLundi] = useState(() => lundiDe(new Date()));
            const jours = Array.from({ length: 6 }, (_, i) => { const d = new Date(lundi); d.setDate(d.getDate() + i); return d; });
            const decaler = (n) => { const d = new Date(lundi); d.setDate(d.getDate() + n * 7); setLundi(d); };
            const noms = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
            const fin = new Date(lundi); fin.setDate(fin.getDate() + 5);
            return (
                <>
                    <div className="actions" style={{ marginBottom: 14, alignItems: 'center' }}>
                        <button className="btn" onClick={() => decaler(-1)} aria-label="Semaine précédente"><Icone nom="gauche" taille={15} /></button>
                        <button className="btn" onClick={() => setLundi(lundiDe(new Date()))}>Cette semaine</button>
                        <button className="btn" onClick={() => decaler(1)} aria-label="Semaine suivante"><Icone nom="droite" taille={15} /></button>
                        <b style={{ marginLeft: 8 }}>Du {fmtDate(isoLocal(lundi))} au {fmtDate(isoLocal(fin))}</b>
                    </div>
                    {conflits.size > 0 && <div className="bandeau erreur"><Icone nom="alerte" /><div>{conflits.size} sessions se chevauchent pour un même formateur. Elles sont signalées en rouge.</div></div>}
                    <div className="semaine">
                        {jours.map((d, i) => { const iso = isoLocal(d); const ss = fSessions.filter(s => s.date === iso).sort((a, b) => (a.heure || '').localeCompare(b.heure || '')); const aa = fAccs.filter(a => a.date === iso); return (
                            <div key={iso} className={`jour ${iso === aujourdhui() ? 'auj' : ''}`}>
                                <div className="jour-tete"><span>{noms[i]}</span><span>{pad(d.getDate())}/{pad(d.getMonth() + 1)}</span></div>
                                {ss.map(s => <div key={s.id} className={`evt ${conflits.has(s.id) ? 'conflit' : ''}`} onClick={() => setVue('formations')}>
                                    <b>{s.heure} · {s.titre}</b><span>{s.activite} · {s.dureeMin} min · {s.statut}{conflits.has(s.id) ? ' · Conflit' : ''}</span>
                                </div>)}
                                {aa.map(a => <div key={a.id} className="evt acc" onClick={() => setVue('accompagnement')}>
                                    <b>{(parId[a.conseillerId] || {}).nom || '?'}</b><span>Accompagnement · {a.competence} · {a.statut}</span>
                                </div>)}
                                {ss.length + aa.length === 0 && <div style={{ color: 'var(--encre-3)', fontSize: 12 }}>—</div>}
                            </div>
                        ); })}
                    </div>
                </>
            );
        }

        // --- RÉFÉRENTIELS ---
        function VueReferentiels({ ctx }) {
            const { ref, enregistrerRef, conseillers } = ctx;
            const [brouillon, setBrouillon] = useState(ref);
            const [modifie, setModifie] = useState(false);
            useEffect(() => { if (!modifie) setBrouillon(ref); }, [ref]);
            const maj = (cle, valeur) => { setBrouillon({ ...brouillon, [cle]: valeur }); setModifie(true); };
            const enregistrer = async () => {
                const propre = {
                    activites: brouillon.activites.map(a => ({ nom: (a.nom || '').trim(), canal: a.canal || 'Entrant' })).filter(a => a.nom),
                    ...Object.fromEntries(['equipes', 'sites', 'formateurs', 'competences', 'typesFormation'].map(k => [k, [...new Set(brouillon[k].map(x => (x || '').trim()).filter(Boolean))]]))
                };
                if (!propre.activites.length || !propre.competences.length) return alert('Il faut au moins une activité et une compétence.');
                const orphelins = conseillers.filter(c => !propre.activites.some(a => a.nom === c.activite)).length;
                if (orphelins && !confirm(`${orphelins} conseillers sont rattachés à une activité que tu as renommée ou supprimée. Ils garderont l'ancien nom jusqu'à modification de leur fiche. Continuer ?`)) return;
                try { await enregistrerRef(propre); setModifie(false); } catch (e) { alert('Enregistrement impossible : ' + e.message); }
            };
            const Liste = ({ cle, titre, aide }) => (
                <div className="carte"><h2>{titre}</h2><p className="sous">{aide}</p>
                    {brouillon[cle].map((v, i) => <div className="ligne-ref" key={i}>
                        <input className="input" value={v} aria-label={`${titre} ${i + 1}`} onChange={e => maj(cle, brouillon[cle].map((x, j) => j === i ? e.target.value : x))} />
                        <button className="btn mini danger" onClick={() => maj(cle, brouillon[cle].filter((_, j) => j !== i))}>Retirer</button>
                    </div>)}
                    <button className="btn mini" onClick={() => maj(cle, [...brouillon[cle], ''])}><Icone nom="plus" taille={13} /> Ajouter</button>
                </div>
            );
            return (
                <>
                    <div className="actions" style={{ marginBottom: 14 }}>
                        <button className="btn primaire" onClick={enregistrer} disabled={!modifie}>Enregistrer les référentiels</button>
                        {modifie && <button className="btn" onClick={() => { setBrouillon(ref); setModifie(false); }}>Annuler les modifications</button>}
                    </div>
                    <div className="carte"><h2>Activités</h2><p className="sous">Chaque activité porte son canal. Le filtre « Canal » s'appuie dessus.</p>
                        {brouillon.activites.map((a, i) => <div className="ligne-ref" key={i}>
                            <input className="input" value={a.nom} aria-label={`Activité ${i + 1}`} onChange={e => maj('activites', brouillon.activites.map((x, j) => j === i ? { ...x, nom: e.target.value } : x))} />
                            <select className="input" style={{ width: 190 }} value={a.canal} aria-label={`Canal activité ${i + 1}`} onChange={e => maj('activites', brouillon.activites.map((x, j) => j === i ? { ...x, canal: e.target.value } : x))}>{CANAUX.map(c => <option key={c}>{c}</option>)}</select>
                            <button className="btn mini danger" onClick={() => maj('activites', brouillon.activites.filter((_, j) => j !== i))}>Retirer</button>
                        </div>)}
                        <button className="btn mini" onClick={() => maj('activites', [...brouillon.activites, { nom: '', canal: 'Entrant' }])}><Icone nom="plus" taille={13} /> Ajouter</button>
                    </div>
                    {Liste({ cle: 'competences', titre: 'Compétences GRC', aide: 'Les compétences évaluées au diagnostic et travaillées en accompagnement.' })}
                    {Liste({ cle: 'equipes', titre: 'Équipes', aide: 'Équipes ou responsables opérationnels.' })}
                    {Liste({ cle: 'typesFormation', titre: 'Types de formation', aide: 'Formation initiale, continue, ateliers, micro-modules…' })}
                    {Liste({ cle: 'formateurs', titre: 'Formateurs', aide: 'Sert au planning et à la détection des conflits.' })}
                    {Liste({ cle: 'sites', titre: 'Sites', aide: '' })}
                </>
            );
        }

        // --- ACCÈS ---
        function VueAcces({ ctx }) {
            const comptes = useCollection('userRoles');
            const changer = async (c, role) => {
                if (c.id === ctx.user.uid) return alert('Tu ne peux pas modifier ton propre rôle.');
                try { await comptes.modifier(c.id, { role }); } catch (e) { alert('Modification impossible : ' + e.message); }
            };
            return (
                <div className="carte">
                    <h2>Comptes</h2><p className="sous">Un nouveau compte n'a accès à rien tant que tu ne lui as pas attribué « Lecture seule ».</p>
                    <table className="tab"><thead><tr><th>E-mail</th><th>Rôle</th></tr></thead>
                        <tbody>{trier(comptes.items, 'email').map(c => <tr key={c.id}><td>{c.email}{c.id === ctx.user.uid ? ' (toi)' : ''}{c.role === 'En attente' && <span className="badge alerte" style={{ marginLeft: 8 }}>À valider</span>}</td>
                            <td style={{ width: 220 }}><Choix valeur={c.role} onChange={v => changer(c, v)} options={ROLES} disabled={c.id === ctx.user.uid} /></td></tr>)}</tbody>
                    </table>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

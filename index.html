        const parseCSV = (str) => {
            const arr = []; let q = false; let r = 0, c = 0;
            for (let i=0; i < str.length; i++) {
                let cc = str[i], nc = str[i+1];
                arr[r] = arr[r] || []; arr[r][c] = arr[r][c] || '';
                if (cc === '"' && q && nc === '"') { arr[r][c] += cc; ++i; continue; }
                if (cc === '"') { q = !q; continue; }
                if (cc === ',' && !q) { ++c; continue; }
                if (cc === '\r' && nc === '\n' && !q) { ++r; c = 0; ++i; continue; }
                if ((cc === '\n' || cc === '\r') && !q) { ++r; c = 0; continue; }
                arr[r][c] += cc;
            }
            return arr;
        };

        const getTypeStyles = (type, isTTT, collision, isValidated) => {
            if (collision && !isValidated) return 'bg-rose-50 border-rose-400 text-rose-900 shadow-rose-100 hover:shadow-rose-200';
            if (isTTT) return 'bg-amber-50 border-amber-400 text-amber-900 shadow-amber-100 hover:shadow-amber-200';
            switch (type) {
                case 'FIM': return 'bg-emerald-50 border-emerald-400 text-emerald-900 shadow-emerald-100';

        const getTypeBadgeColor = (type, isTTT, collision, isValidated) => {

                case 'Spécialisation': return 'bg-purple-200 text-purple-800';
                case 'Projet Genesys': return 'bg-indigo-200 text-indigo-800';

                default: return 'bg-slate-200 text-slate-800';

        const getStatusColor = (s) => {
            switch(s) {

                case 'En cours': return 'bg-amber-100 text-amber-700 border-amber-200';
                case 'Terminé': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
                case 'Annulé': return 'bg-rose-100 text-rose-700 border-rose-200';
                case 'En attente de validation': return 'bg-violet-100 text-violet-700 border-violet-200';
                case 'Arbitrage requis': return 'bg-orange-100 text-orange-700 border-orange-200';
                case 'Sélection des agents en cours': return 'bg-cyan-100 text-cyan-700 border-cyan-200';
                case 'À planifier': return 'bg-slate-200 text-slate-700 border-slate-300';
                default: return 'bg-slate-100 text-slate-700';
            }
        };

        const getMonthYear = (dStr) => {
            if (!dStr) return 'Inconnu';
            const d = new Date(dStr);
            if (isNaN(d.getTime())) return 'Inconnu';
            return d.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });
        };

        const getISOWeek = (d) => {
            if (!(d instanceof Date) || isNaN(d.getTime())) return 0;
            const dt = new Date(d.getTime());
            dt.setHours(0, 0, 0, 0);
            dt.setDate(dt.getDate() + 3 - (dt.getDay() + 6) % 7);
            const w1 = new Date(dt.getFullYear(), 0, 4);
            return 1 + Math.round(((dt.getTime() - w1.getTime()) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
        };

        const getDaysForWeek = (wStr) => {
            if (!wStr) return Array(5).fill({name: '-', date: '-'});
            const wm = String(wStr).match(/\d+/);
            if (!wm) return Array(5).fill({name: '-', date: '-'});
            const wn = parseInt(wm[0], 10);
            const y = new Date().getFullYear();
            const s = new Date(y, 0, 1 + (wn - 1) * 7);
            const isoS = new Date(s);
            if (s.getDay() <= 4) isoS.setDate(s.getDate() - s.getDay() + 1);
            else isoS.setDate(s.getDate() + 8 - s.getDay());
            const days = [];
            const names = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
            for(let i=0; i<5; i++) {
                const d = new Date(isoS);
                d.setDate(d.getDate() + i);
                days.push({ name: names[i], date: d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) });
            }
            return days;
        };

        const getWeekDateRange = (wStr) => {
            if (!wStr) return null;
            const wm = String(wStr).match(/\d+/);
            if (!wm) return null;
            const wn = parseInt(wm[0], 10);
            const y = new Date().getFullYear();
            const s = new Date(y, 0, 1 + (wn - 1) * 7);
            const isoS = new Date(s);
            if (s.getDay() <= 4) isoS.setDate(s.getDate() - s.getDay() + 1);
            else isoS.setDate(s.getDate() + 8 - s.getDay());
            const e = new Date(isoS);
            e.setDate(e.getDate() + 6);
            const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            return { min: fmt(isoS), max: fmt(e) };
        };

        const calculerNiveaux = (fs) => {
            const sorted = [...fs].sort((a, b) => (new Date(a?.startDate || 0).getTime()||0) - (new Date(b?.startDate || 0).getTime()||0));
            const lvls = [];
            return sorted.map(t => {
                const s = new Date(t?.startDate || 0);
                if (isNaN(s.getTime())) return { ...t, level: 0 };
                const e = new Date(s);
                e.setDate(s.getDate() + (parseFloat(t?.duration) || 0));
                let l = 0;
                while (lvls[l] && lvls[l] > s) { l++; }
                lvls[l] = e;
                return { ...t, level: l };
            });
        };

        const formatHeures = (v) => isNaN(v) || v===null || v===undefined ? '0h' : `${Math.round(v * 10) / 10}h`;

        const formaterDuree = (t) => {
            if (!t) return '0 j';
            if (t.type === 'PSF' || t.isTTT) return `${Math.round((parseFloat(t.duration) || 0) * 420)} min`;
            if (t.type === 'Projet Genesys') {
                const v = parseFloat(t.duration);
                if (Math.abs(v - 2/7) < 0.01) return '2h';
                if (Math.abs(v - 3/7) < 0.01) return '3h';
                if (Math.abs(v - 3.5/7) < 0.01) return '3h30';
                if (Math.abs(v - 4/7) < 0.01) return '4h';
                if (Math.abs(v - 1) < 0.01) return '1 journée';
                if (Math.abs(v - 1.5) < 0.01) return '1.5 jrs';
            }
            return `${t.duration || 0} j`;
        };

        const isOverlap = (s1, e1, s2, e2) => new Date(s1) <= new Date(e2) && new Date(e1) >= new Date(s2);

        const SITES = ["Rabat", "Meknès"];
        const SITES_TTT = ["Rabat", "Meknès", "Rabat & Meknès"];

        const GENESYS_DUREES = [
            { label: '2h', val: 2/7 }, { label: '3h', val: 3/7 }, { label: '3h30', val: 3.5/7 },
            { label: '4h', val: 4/7 }, { label: '1 journée', val: 1 }, { label: '1.5 jrs', val: 1.5 }
        ];
        const JOUR_EN_MINUTES = 420;

        const Field = ({l, c="", children}) => (<div className="flex flex-col gap-1"><label className={`text-[10px] font-black uppercase text-slate-400 mb-1 block tracking-widest ${c}`}>{l}</label>{children}</div>);
        const TInput = ({v, onChange, t="text", ph="", c="", min, max, readOnly}) => <input type={t} className={`w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 font-bold text-xs outline-none focus:ring-2 focus:ring-blue-500 shadow-inner ${c}`} value={v !== undefined && v !== null ? v : ''} onChange={e=>onChange && onChange(e.target.value)} placeholder={ph} min={min} max={max} readOnly={readOnly}/>;
        const TSelect = ({v, onChange, opts, c=""}) => <select className={`w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2.5 font-bold text-xs outline-none shadow-sm ${c}`} value={v !== undefined && v !== null ? v : ''} onChange={e=>onChange && onChange(e.target.value)}>{opts.map(o=>{ const val = o.val !== undefined ? o.val : o; const label = o.label !== undefined ? o.label : o; return <option key={String(val)} value={val}>{label}</option> })}</select>;

        function App() {
            const [user, setUser] = useState(null);
            const [userRole, setUserRole] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const checkAnonym = async () => { if (isSharedLink) { try { await signInAnonymously(auth); } catch (e) {} } };
                checkAnonym();
                return onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        setUser(u);
                        if (u.isAnonymous) { setUserRole('Lecture seule'); setLoading(false); }
                        else {
                            try {
                                const d = await getDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', 'userRoles', u.uid));
                                setUserRole(d.exists() ? d.data().role : 'Lecture seule');
                            } catch (e) { setUserRole('Lecture seule'); }
                            setLoading(false);
                        }
                    } else { setUser(null); setUserRole(null); setLoading(false); }
                });
            }, []);

            if (loading) return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center">
                    <div className="flex flex-col items-center gap-4">
                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-slate-300 border-t-blue-600"></div>
                        <p className="text-slate-500 font-bold tracking-widest uppercase text-xs">Chargement...</p>
                    </div>
                </div>
            );
            if (!user) return <EcranAuthentification />;
            return <OutilPilotage user={user} userRole={userRole} setUserRole={setUserRole} />;
        }

        function EcranAuthentification() {
            const [estInscr, setEstInscr] = useState(false);
            const [email, setEmail] = useState('');
            const [pwd, setPwd] = useState('');
            const [err, setErr] = useState('');
            const [charg, setCharg] = useState(false);
            const [succ, setSucc] = useState('');

            const gererSoum = async (e) => {
                e.preventDefault(); setErr(''); setSucc(''); setCharg(true);
                try {
                    if (estInscr) {
                        const uc = await createUserWithEmailAndPassword(auth, email, pwd);
                        await setDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', 'userRoles', uc.user.uid), { email, role: 'Lecture seule', dateCreation: Date.now() });
                        setSucc('Compte créé !'); setTimeout(() => setEstInscr(false), 2000);
                    } else {
                        await signInWithEmailAndPassword(auth, email, pwd);
                    }
                } catch (error) { setErr(error.message); }
                finally { setCharg(false); }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200">
                        <div className="bg-[#0f172a] p-10 text-center relative overflow-hidden">
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-screen filter blur-[40px] opacity-40"></div>
                            <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-emerald-500 rounded-full mix-blend-screen filter blur-[40px] opacity-40"></div>
                            <div className="relative z-10">
                                <img src="logo.png" onError={(e)=>{e.target.onerror=null; e.target.src="https://upload.wikimedia.org/wikipedia/commons/4/42/Nespresso_logo.svg"}} alt="Nespresso" className="h-16 w-16 rounded-2xl shadow-lg object-cover mx-auto mb-4 bg-black border border-slate-800" />
                                <h2 className="text-2xl font-black text-white uppercase tracking-widest">{estInscr ? 'Créer un accès' : 'Espace Sécurisé'}</h2>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mt-2">Pilotage Formation Nespresso</p>
                            </div>
                        </div>
                        <div className="p-8">
                            {err && <div className="mb-4 p-3 bg-rose-50 border-l-4 border-rose-500 text-rose-700 text-xs font-bold rounded-r-lg">{err}</div>}
                            {succ && <div className="mb-4 p-3 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 text-xs font-bold rounded-r-lg">{succ}</div>}
                            <form onSubmit={gererSoum} className="space-y-4">
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Email</label>
                                    <div className="relative">
                                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icone nom="mail" taille={18}/></div>
                                        <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-500" placeholder="email@concentrix.com"/>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Mot de passe</label>
                                    <div className="relative">
                                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icone nom="lock" taille={18}/></div>
                                        <input type="password" required value={pwd} onChange={e=>setPwd(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-500" placeholder="••••••••"/>
                                    </div>
                                </div>
                                <button type="submit" disabled={charg} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl flex justify-center items-center gap-2 uppercase tracking-widest text-xs transition-all shadow-xl shadow-blue-600/20 active:scale-95 disabled:opacity-50">
                                    {charg ? <Icone nom="chargement" classe="animate-spin" taille={18}/> : estInscr ? <><Icone nom="user-plus" taille={18}/> Demander accès</> : <><Icone nom="log-in" taille={18}/> Connexion</>}
                                </button>
                            </form>
                            <button onClick={()=>{setEstInscr(!estInscr); setErr(''); setSucc('');}} className="mt-6 w-full text-xs font-bold text-slate-500 hover:text-blue-600 transition-colors underline underline-offset-4">
                                {estInscr ? "J'ai déjà un compte" : "Demander un compte"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function OutilPilotage({ user, userRole, setUserRole }) {
            const peutEditer = userRole === 'Admin' || userRole === 'Manager';
            const [env, setEnv] = useState('B2C');
            const [chargement, setChargement] = useState(true);
            const [formations, setFormations] = useState([]);
            const [vue, setVue] = useState('accueil');
            const [conges, setConges] = useState([]);
            const [modalConge, setModalConge] = useState(false);
            const defaultConge = { trainer: 'Rachid', startDate: new Date().toISOString().split('T')[0], endDate: new Date().toISOString().split('T')[0], type: 'Congé Annuel', comment: '' };
            const [nouveauConge, setNouveauConge] = useState(defaultConge);
            const [filtres, setFiltres] = useState({ sites: [], statuts: [], semaines: [], mois: [], types: [], noms: [] });
            const [modalMultipleMode, setModalMultipleMode] = useState(null);
            const [modalEditionMode, setModalEditionMode] = useState(null);
            const [editionEnCours, setEditionEnCours] = useState(false);
            const [texteImport, setTexteImport] = useState('');
            const [afficherImportExcel, setAfficherImportExcel] = useState(false);
            const defaultFormation = { name: '', type: 'Formation continue', week: 'S12', site: 'Rabat', trainer: 'Rachid', funding: 'Concentrix', agents: 12, agentsRealises: 0, duration: 1, startDate: new Date().toISOString().split('T')[0], status: 'Planifié', comment: '', isValidated: false, isTTT: false, cible: [] };
            const defaultFormationPSF = { ...defaultFormation, type: 'PSF', duration: 60/JOUR_EN_MINUTES, dates: [], cible: [], deadline: '' };
            const [nouvelleFormation, setNouvelleFormation] = useState(defaultFormation);
            const [nouvelleFormationPSF, setNouvelleFormationPSF] = useState(defaultFormationPSF);
            const [dateTemp, setDateTemp] = useState('');
            const [lignesMultiples, setLignesMultiples] = useState([]);
            const [lignesMultiplesPSF, setLignesMultiplesPSF] = useState([]);
            const [lignesMultiplesTTT, setLignesMultiplesTTT] = useState([]);
            const timelineRef = useRef(null);

            const getColName = () => env === 'B2C' ? 'formations' : 'formations_b2b';

            useEffect(() => {
                setChargement(true);
                const unsub = onSnapshot(collection(db, 'artifacts', artifactAppId, 'public', 'data', getColName()), (s) => {
                    setFormations(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setChargement(false);
                });
                return () => unsub();
            }, [env]);

            useEffect(() => {
                const unsub = onSnapshot(collection(db, 'artifacts', artifactAppId, 'public', 'data', 'conges'), s => setConges(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsub();
            }, []);

            const currentWeekNum = useMemo(() => getISOWeek(new Date()), []);
            const allStatuts = useMemo(() => [...new Set(formations.map(f => f?.status).filter(Boolean))], [formations]);
            const allNomsGenesys = useMemo(() => [...new Set(formations.filter(f => f?.type === 'Projet Genesys').map(f => f?.name).filter(Boolean))], [formations]);
            const semainesDynamiques = useMemo(() => [...new Set(formations.flatMap(t => t?.week?.split(',').map(w=>w.trim())||[]))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})), [formations]);
            const moisDeLAnnee = useMemo(() => {
                const y = new Date().getFullYear();
                const mArr = [];
                for (let i=0; i<12; i++) mArr.push(new Date(y, i, 1).toLocaleString('fr-FR', { month: 'long', year: 'numeric' }));
                formations.forEach(f => { const m = getMonthYear(f?.startDate); if (m !== 'Inconnu' && !mArr.includes(m)) mArr.push(m); });
                return mArr;
            }, [formations]);

            const targetWeekDisplay = useMemo(() => 'S' + (currentWeekNum + 2), [currentWeekNum]);
            const formationsSelectionAgent = useMemo(() => formations.filter(f => f?.status === 'À planifier' && f?.week === targetWeekDisplay && f?.type === 'Spécialisation'), [formations, targetWeekDisplay]);

            const chronologieDonnees = useMemo(() => {
                const now = new Date(); now.setHours(0,0,0,0);
                let start = new Date(now); start.setDate(now.getDate() - 7);
                let end = new Date(start); end.setDate(end.getDate() + 90);
                const dates = formations.filter(t => t?.type !== 'PSF').map(t => new Date(t?.startDate || 0)).filter(d => !isNaN(d.getTime())).sort((a, b) => a - b);
                if (dates.length > 0) {
                    if (dates[0] < start) { start = new Date(dates[0]); start.setDate(start.getDate() - 7); }
                    const lastDate = new Date(dates[dates.length - 1]); lastDate.setDate(lastDate.getDate() + 30);
                    if (lastDate > end) end = lastDate;
                }
                let totalSpan = Math.ceil((end - start) / (1000 * 3600 * 24));
                totalSpan = Math.max(90, Math.min(totalSpan, 365));
                const days = Array.from({ length: totalSpan }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
                return { start, days, totalSpan };
            }, [formations]);

            const passeFiltres = (t) => {
                if (!t) return false;
                if (filtres.sites?.length && !filtres.sites.includes(t.site)) return false;
                if (filtres.statuts?.length && !filtres.statuts.includes(t.status)) return false;
                if (filtres.types?.length && !filtres.types.includes(t.type)) return false;
                if (filtres.noms?.length && !filtres.noms.includes(t.name)) return false;
                if (filtres.semaines?.length && (!t.week || !filtres.semaines.some(sw => t.week.includes(sw)))) return false;
                if (filtres.mois?.length && !filtres.mois.includes(getMonthYear(t.startDate))) return false;
                return true;
            };

            const fFiltrees = useMemo(() => formations.filter(t => !t?.isTTT && passeFiltres(t)).sort((a,b)=>String(a?.week||'').localeCompare(String(b?.week||''),undefined,{numeric:true})), [formations, filtres]);
            const formationsPSF = useMemo(() => formations.filter(t => t?.type === 'PSF' && !t?.isTTT && passeFiltres(t)).sort((a,b)=>String(a?.week||'').localeCompare(String(b?.week||''),undefined,{numeric:true})), [formations, filtres]);
            const formationsSpe = useMemo(() => formations.filter(t => t?.type === 'Spécialisation' && !t?.isTTT && passeFiltres(t)).sort((a,b)=>String(a?.week||'').localeCompare(String(b?.week||''),undefined,{numeric:true})), [formations, filtres]);
            const formationsFim = useMemo(() => formations.filter(t => t?.type === 'FIM' && !t?.isTTT && passeFiltres(t)).sort((a,b)=>String(a?.week||'').localeCompare(String(b?.week||''),undefined,{numeric:true})), [formations, filtres]);
            const formationsGenesys = useMemo(() => formations.filter(t => t?.type === 'Projet Genesys' && !t?.isTTT && passeFiltres(t)).sort((a,b)=>String(a?.week||'').localeCompare(String(b?.week||''),undefined,{numeric:true})), [formations, filtres]);
            const formationsTTT = useMemo(() => formations.filter(t => t?.isTTT && passeFiltres(t)).sort((a,b)=>String(a?.week||'').localeCompare(String(b?.week||''),undefined,{numeric:true})), [formations, filtres]);

            const bilanMensuelData = useMemo(() => formations.filter(t => t && !t.isTTT && t.status !== 'Annulé' && passeFiltres(t)), [formations, filtres]);
            const bilanHebdoData = useMemo(() => formations.filter(t => t && !t.isTTT && t.status !== 'Annulé' && passeFiltres(t) && (!filtres.semaines?.length || (t.week && filtres.semaines.some(sw => t.week.includes(sw))))), [formations, filtres]);

            const suiviDonnees = useMemo(() => {
                const base = formations.filter(t => !t?.isTTT && t?.status !== 'Annulé' && passeFiltres(t));
                const typesSet = new Set(); let grandTotal = 0; const colTotals = {};
                base.forEach(t => { const type = t.type || 'Autre'; const hours = (parseFloat(t.duration)||0)*7*(parseInt(t.agents)||0); if (!colTotals[type]) colTotals[type]=0; colTotals[type]+=hours; typesSet.add(type); grandTotal+=hours; });
                return { types: Array.from(typesSet).sort(), colTotals, grandTotal };
            }, [formations, filtres]);

            const heuresParSite = useMemo(() => {
                let rabat=0, meknes=0;
                formations.filter(t => !t?.isTTT && t?.status !== 'Annulé' && passeFiltres(t)).forEach(t => { const h=(parseFloat(t.duration)||0)*7*(parseInt(t.agents)||0); if(t.site==='Rabat') rabat+=h; else if(t.site==='Meknès') meknes+=h; else {rabat+=h/2; meknes+=h/2;} });
                return { rabat, meknes };
            }, [formations, filtres]);

            const fStats = useMemo(() => {
                const b = fFiltrees.filter(f => f?.status !== 'Annulé');
                const t = b.length; const term = b.filter(f => f?.status === 'Terminé').length;
                return { total: t, terminees: term, enCours: b.filter(f => f?.status === 'En cours').length, planifiees: b.filter(f => !['Terminé','En cours'].includes(f?.status)).length, taux: t>0?Math.round((term/t)*100):0 };
            }, [fFiltrees]);

            const carteConflits = useMemo(() => {
                const map = {};
                formations.filter(t => t?.type !== 'PSF').forEach(t => {
                    if(!t || !t.week) return;
                    if (t.isTTT && t.cible?.length > 0) { t.cible.forEach(c => { if(c==='Tous les formateurs') return; const cle=`${c}-${t.week}`; if(!map[cle]) map[cle]=[]; map[cle].push(t.id); }); }
                    else if (t.trainer) { const cle=`${t.trainer}-${t.week}`; if(!map[cle]) map[cle]=[]; map[cle].push(t.id); }
                });
                return map;
            }, [formations]);

            const hasConflict = (t) => {
                if (!t) return false;
                if (t.isTTT && t.cible?.length > 0) return t.cible.some(c => carteConflits[`${c}-${t.week}`]?.length > 1);
                return carteConflits[`${t.trainer}-${t.week}`]?.length > 1;
            };

            const isSMinus1 = (t) => {
                if (t?.status !== 'À planifier' || !t?.week) return false;
                const wn = parseInt(String(t.week).replace(/[^0-9]/g,''), 10);
                return (wn === currentWeekNum + 1) || (currentWeekNum === 52 && wn === 1);
            };

            const rappelsPSF = useMemo(() => formations.filter(t => t?.type === 'PSF' && isSMinus1(t)), [formations, currentWeekNum]);
            const rappelsSpe = useMemo(() => formations.filter(t => t?.type === 'Spécialisation' && isSMinus1(t)), [formations, currentWeekNum]);
            const rappelsFim = useMemo(() => formations.filter(t => t?.type === 'FIM' && isSMinus1(t)), [formations, currentWeekNum]);
            const rappelsGenesys = useMemo(() => formations.filter(t => t?.type === 'Projet Genesys' && isSMinus1(t)), [formations, currentWeekNum]);

            const updatePSFDates = (newDates) => {
                const sortedDates = [...newDates].sort();
                const weeks = [...new Set(sortedDates.map(d => 'S' + getISOWeek(new Date(d))))].join(', ');
                setNouvelleFormationPSF(prev => ({ ...prev, dates: sortedDates, startDate: sortedDates[0] || '', week: weeks }));
            };

            const validerFormation = async () => {
                const isPSF = modalEditionMode === 'PSF';
                const fToSave = isPSF ? nouvelleFormationPSF : nouvelleFormation;
                if(!fToSave.name) return;
                const payload = { ...fToSave, duration: parseFloat(fToSave.duration)||0, agents: parseInt(fToSave.agents)||0, agentsRealises: parseInt(fToSave.agentsRealises)||0, id: fToSave.id || Date.now().toString(), updatedAt: new Date().toISOString() };
                await setDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', getColName(), payload.id), payload);
                setModalEditionMode(null);
            };

            const mettreAJourStatutDirect = async (id, nouveauStatut) => {
                await updateDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', getColName(), id), { status: nouveauStatut, updatedAt: new Date().toISOString() });
            };

            const deleteTraining = async (id) => {
                if(window.confirm('Supprimer cette session ?')) await deleteDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', getColName(), id));
            };

            const openEditModal = (t) => {
                if(!peutEditer) return;
                if (t.type === 'PSF') { setNouvelleFormationPSF({ ...defaultFormationPSF, ...t, dates: t.dates || [t.startDate] }); setEditionEnCours(true); setModalEditionMode('PSF'); }
                else if (t.isTTT) { setNouvelleFormation({ ...defaultFormation, cible: t.cible || ['Tous les formateurs'], ...t }); setEditionEnCours(true); setModalEditionMode('TTT'); }
                else { setNouvelleFormation({ ...defaultFormation, ...t }); setEditionEnCours(true); setModalEditionMode('standard'); }
            };

            const dupliquerFormation = (t) => {
                if(!peutEditer) return;
                if (t.type === 'PSF') { setNouvelleFormationPSF({ ...defaultFormationPSF, ...t, id: undefined, name: `${t?.name||''} (Copie)`, isValidated: false, dates: t.dates||[t.startDate] }); setEditionEnCours(false); setModalEditionMode('PSF'); }
                else { setNouvelleFormation({ ...defaultFormation, ...t, id: undefined, name: `${t?.name||''} (Copie)`, isValidated: false }); setEditionEnCours(false); t?.isTTT ? setModalEditionMode('TTT') : setModalEditionMode('standard'); }
            };

            const sauvegarderConge = async () => {
                if(!nouveauConge.trainer || !nouveauConge.startDate || !nouveauConge.endDate) return alert("Dates obligatoires");
                await setDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', 'conges', Date.now().toString()), nouveauConge);
                setNouveauConge(defaultConge);
            };

            const supprimerConge = async (id) => {
                if(window.confirm("Supprimer ce congé ?")) await deleteDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', 'conges', id));
            };

            const gererDeconnexion = () => signOut(auth);

            const handleExtraireCSV = () => {
                const exportData = formations.filter(passeFiltres).sort((a,b) => new Date(a.startDate).getTime() - new Date(b.startDate).getTime());
                const entetes = ["Mois","Semaine","Formation","Type","Site","Statut","Formateur","Date Debut","Duree","Agents Prevus","Agents Formes","Heures Prevues","Heures Realisees","Prise en charge","Commentaire"];
                const lignes = exportData.map(t => {
                    const hP = (parseFloat(t.duration)||0)*7*(parseInt(t.agents)||0);
                    const hR = (parseFloat(t.duration)||0)*7*(parseInt(t.agentsRealises)||0);
                    return [`"${getMonthYear(t.startDate)}"`,`"${t.week||''}"`,`"${t.name||''}"`,`"${t.type||''}"`,`"${t.site||''}"`,`"${t.status||''}"`,`"${t.trainer||''}"`,`"${t.startDate||''}"`,`"${formaterDuree(t)}"`,t.agents||0,t.agentsRealises||0,Math.round(hP*10)/10,Math.round(hR*10)/10,`"${t.funding||''}"`,`"${(t.comment||'').replace(/"/g,'""')}"`].join(";");
                });
                const csvStr = "\ufeff" + [entetes.join(";"), ...lignes].join("\n");
                const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const lien = document.createElement("a"); lien.href=url; lien.download=`Extraction_${env}_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(lien); lien.click(); document.body.removeChild(lien);
            };

            const enregistrerMultiples = async (mode) => {
                const lignes = mode==='PSF' ? lignesMultiplesPSF : (mode==='TTT' ? lignesMultiplesTTT : lignesMultiples);
                if(lignes.some(r=>!r.name)) return alert("Noms manquants");
                setChargement(true);
                for (const item of lignes) { await setDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', getColName(), item.id), item); }
                setModalMultipleMode(null);
                if(mode==='PSF') setLignesMultiplesPSF([]); else if(mode==='TTT') setLignesMultiplesTTT([]); else setLignesMultiples([]);
                setChargement(false);
            };

            const miseAJourLigne = (id, champ, valeur, mode) => {
                if(mode==='PSF') setLignesMultiplesPSF(p=>p.map(r=>r.id===id?{...r,[champ]:valeur}:r));
                else if(mode==='TTT') setLignesMultiplesTTT(p=>p.map(r=>r.id===id?{...r,[champ]:valeur}:r));
                else setLignesMultiples(p=>p.map(r=>r.id===id?{...r,[champ]:valeur}:r));
            };

            const renderTableEnsemble = (data) => (
                <div className="overflow-x-auto">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Semaine</th>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Formation</th>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400 text-center">Statut</th>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Formateur</th>
                                {peutEditer && <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400 text-right">Actions</th>}
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {data.length === 0 && <tr><td colSpan={5} className="px-6 py-10 text-center text-slate-400 font-bold text-sm">Aucune session</td></tr>}
                            {data.map(t => {
                                if(!t) return null;
                                const progress = t.agents > 0 ? Math.min(100, Math.round(((t.agentsRealises||0)/t.agents)*100)) : 0;
                                return (
                                    <tr key={t.id} className="hover:bg-slate-50 transition-colors">
                                        <td className="px-6 py-5"><span className="font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-lg text-sm">{t.week}</span></td>
                                        <td className="px-6 py-5">
                                            <div className="font-black text-slate-800 uppercase">{t.isTTT && '🎓 '}{t.name}</div>
                                            <div className="text-[10px] font-bold text-slate-400 uppercase mt-1">{t.type} • {t.site}</div>
                                            {t.comment && <div className="text-[10px] text-slate-500 mt-1">{t.comment}</div>}
                                        </td>
                                        <td className="px-6 py-5 text-center">
                                            <select disabled={!peutEditer} value={t.status||''} onChange={e=>mettreAJourStatutDirect(t.id,e.target.value)} className={`px-2 py-1 rounded-full text-[9px] font-black uppercase border ${getStatusColor(t.status)} outline-none appearance-none text-center ${peutEditer?'cursor-pointer':'cursor-not-allowed opacity-80'}`} style={{textAlignLast:'center'}}>
                                                {STATUTS.map(s=><option key={s} value={s}>{s}</option>)}

                            {/* VUE TIMELINE */}
                            {!chargement && vue==='chronologie' && (
                                <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 p-6 h-[calc(100vh-200px)] flex flex-col overflow-hidden">
                                    <div ref={timelineRef} className="flex-1 w-full overflow-auto rounded-2xl border border-slate-200 relative custom-scrollbar">
                                        <div style={{minWidth:`${chronologieDonnees.totalSpan*40}px`}}>
                                            <div className="flex bg-[#0f172a] text-white font-black text-[10px] uppercase sticky top-0 z-40 h-10 shadow-md">
                                                <div className="w-56 border-r border-slate-700 flex items-center justify-center sticky left-0 bg-[#0f172a] z-50 shrink-0">Sites</div>
                                                <div className="flex-1 flex">
                                                    {chronologieDonnees.days.map((d,i)=>(
                                                        <div key={i} className={`flex-1 flex items-center justify-center border-r border-slate-700/30 text-[8px] ${d.getDay()===0||d.getDay()===6?'bg-slate-800':''}`}>{d.getDate()}</div>
                                                    ))}
                                                </div>
                                            </div>
                                            {SITES.map(site=>{
                                                const formSite = formations.filter(t=>t&&(t.site===site||t.site==='Rabat & Meknès')&&t.type!=='PSF'&&passeFiltres(t));
                                                const withLevels = calculerNiveaux(formSite);
                                                return (
                                                    <div key={site} className="flex border-b border-slate-100 relative min-h-[140px]">
                                                        <div className="w-56 p-6 font-black text-slate-800 bg-white sticky left-0 z-10 border-r flex items-center gap-2 shrink-0"><Icone nom="batiment" taille={14} classe={site==='Rabat'?'text-rose-500':'text-blue-500'}/>{site}</div>
                                                        <div className="flex-1 relative timeline-grid-sub" style={{backgroundSize:`calc(100%/${chronologieDonnees.totalSpan}) 100%`}}>
                                                            {withLevels.map(t=>{
                                                                const deb=new Date(t.startDate||0); deb.setHours(0,0,0,0);
                                                                const diff=(deb-chronologieDonnees.start)/86400000;
                                                                if(isNaN(diff)||diff<0||diff>=chronologieDonnees.totalSpan) return null;
                                                                return (
                                                                    <div key={t.id} onClick={()=>openEditModal(t)} className={`absolute h-12 rounded-xl flex flex-col justify-center px-3 text-[9px] font-black border-2 shadow-lg hover:scale-105 hover:z-[100] cursor-pointer transition-all ${t.isTTT?'bg-amber-50 border-amber-300 text-amber-800':(site==='Rabat'?'bg-rose-50 border-rose-300 text-rose-800':'bg-blue-50 border-blue-300 text-blue-800')}`}
                                                                        style={{left:`${(diff/chronologieDonnees.totalSpan)*100}%`,width:`${Math.max((parseFloat(t.duration)/chronologieDonnees.totalSpan)*100,0.5)}%`,top:`${20+t.level*60}px`}}>
                                                                        <div className="truncate uppercase">{t.name}</div>
                                                                        <div className="text-[8px] opacity-60">{t.trainer} · {formaterDuree(t)}</div>
                                                                    </div>
                                                                );
                                                            })}
                                                            <div className="absolute top-0 bottom-0 marker-today z-30 w-0.5 bg-rose-500" style={{left:`${(Math.max(0,(new Date()-chronologieDonnees.start)/86400000)/chronologieDonnees.totalSpan)*100}%`}}></div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* VUE SELECTION */}
                            {!chargement && vue==='selection' && (
                                <div className="bg-white p-8 rounded-[3rem] shadow-xl border border-slate-200">
                                    <h2 className="text-xl font-black mb-6">Sélections requises pour {targetWeekDisplay}</h2>
                                    {formationsSelectionAgent.length===0?(
                                        <p className="text-slate-400 font-bold text-center py-10">Aucune sélection requise pour {targetWeekDisplay}.</p>
                                    ):(
                                        <div className="grid grid-cols-3 gap-6">
                                            {formationsSelectionAgent.map(f=>(
                                                <div key={f.id} className="bg-slate-50 border border-slate-200 p-6 rounded-[2rem]">
                                                    <span className="text-[10px] font-black text-blue-600 bg-blue-100 px-3 py-1 rounded-lg mb-3 inline-block">{f.week}</span>
                                                    <h4 className="font-black text-slate-800 uppercase mb-4">{f.name}</h4>
                                                    <div className="text-xs font-bold text-slate-500 space-y-1">
                                                        <div>{f.site} · {f.agents} agents</div>
                                                        <div>Début : {f.startDate}</div>
                                                    </div>
                                                    {peutEditer && (
                                                        <div className="flex gap-2 mt-4">
                                                            <button onClick={()=>mettreAJourStatutDirect(f.id,'Sélection des agents en cours')} className="flex-1 bg-cyan-100 text-cyan-700 text-[10px] font-black uppercase py-2 rounded-xl">En cours</button>
                                                            <button onClick={()=>mettreAJourStatutDirect(f.id,'Terminé')} className="flex-1 bg-emerald-100 text-emerald-700 text-[10px] font-black uppercase py-2 rounded-xl">Terminé</button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* VUE PLANNING FORMATEURS */}
                            {!chargement && vue==='planning' && (
                                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 p-4 overflow-auto">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-black uppercase">Planning Formateurs</h2>
                                        {peutEditer && <button onClick={()=>setModalConge(true)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black uppercase flex items-center gap-2"><Icone nom="soleil" taille={14}/> Gérer Congés</button>}
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full border-collapse min-w-[800px]">
                                            <thead>
                                                <tr className="bg-slate-900 text-white text-[9px] font-black uppercase">
                                                    <th className="p-3 text-center w-16">Sem.</th>
                                                    {TRAINERS.map(t=><th key={t} className="p-3 text-center">{t}</th>)}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {semainesDynamiques.map(w=>(
                                                    <tr key={w} className="border-b border-slate-200">
                                                        <td className="p-2 text-center font-black text-blue-700 text-xs bg-white border-r">{w}</td>
                                                        {TRAINERS.map(trainer=>{
                                                            const weekRange = getWeekDateRange(w);
                                                            const items = formations.filter(t=>{
                                                                if(!t||t.type==='PSF'||!t.week||!t.week.includes(w)||!passeFiltres(t)) return false;
                                                                if(t.isTTT) return (t.cible||[]).includes(trainer)||(t.cible||[]).includes('Tous les formateurs');
                                                                return t.trainer===trainer;
                                                            });
                                                            const overlappingConges = conges.filter(c=>c.trainer===trainer&&weekRange&&c.startDate&&c.endDate&&isOverlap(c.startDate,c.endDate,weekRange.min,weekRange.max));
                                                            return (
                                                                <td key={`${w}-${trainer}`} className={`p-2 border-r border-slate-200 min-w-[140px] align-top ${overlappingConges.length>0&&items.length===0?'bg-striped':''}`}>
                                                                    {overlappingConges.map(c=><div key={c.id} className="bg-slate-100 border border-dashed border-slate-300 text-slate-500 text-[8px] font-bold p-2 rounded-lg mb-1">🏖️ {c.type}</div>)}
                                                                    {items.map(s=>(
                                                                        <div key={s.id} onClick={()=>openEditModal(s)} className={`text-[9px] font-black border-l-2 bg-white border border-slate-200 p-2 rounded-lg mb-1 cursor-pointer hover:shadow-md transition-all ${getTypeStyles(s.type,s.isTTT,false,true)}`}>
                                                                            <div className="uppercase truncate">{s.name}</div>
                                                                            <div className="opacity-60 mt-0.5">{formaterDuree(s)} · {s.site?.split(' ')?.[0]}</div>
                                                                        </div>
                                                                    ))}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                        </main>

                        {/* MODALE CONGÉS */}
                        {modalConge && peutEditer && (
                            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-50 p-6">
                                <div className="bg-white rounded-[3rem] w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                                    <div className="p-8 bg-slate-800 text-white flex justify-between items-center">
                                        <h2 className="text-xl font-black uppercase flex items-center gap-2"><Icone nom="soleil" taille={24}/> Congés Formateurs</h2>
                                        <button onClick={()=>setModalConge(false)} className="text-2xl font-black">×</button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-8 space-y-6">
                                        <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                            <h3 className="text-xs font-black uppercase text-slate-500 mb-4">Ajouter une indisponibilité</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <Field l="Formateur"><TSelect v={nouveauConge.trainer} onChange={v=>setNouveauConge({...nouveauConge,trainer:v})} opts={TRAINERS}/></Field>
                                                <Field l="Type"><TSelect v={nouveauConge.type} onChange={v=>setNouveauConge({...nouveauConge,type:v})} opts={['Congé Annuel','Maladie','Récupération','Autre']}/></Field>
                                                <Field l="Début"><TInput t="date" v={nouveauConge.startDate} onChange={v=>setNouveauConge({...nouveauConge,startDate:v})}/></Field>
                                                <Field l="Fin"><TInput t="date" v={nouveauConge.endDate} onChange={v=>setNouveauConge({...nouveauConge,endDate:v})}/></Field>
                                            </div>
                                            <button onClick={sauvegarderConge} className="mt-4 bg-slate-800 text-white px-6 py-3 rounded-xl font-black text-xs uppercase flex items-center gap-2"><Icone nom="plus" taille={14}/> Ajouter</button>
                                        </div>
                                        <div>
                                            <h3 className="text-xs font-black uppercase text-slate-500 mb-4">Congés enregistrés</h3>
                                            {conges.length===0 && <p className="text-slate-400 text-sm text-center py-4">Aucun congé.</p>}
                                            {[...conges].sort((a,b)=>new Date(b.startDate)-new Date(a.startDate)).map(c=>(
                                                <div key={c.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-xl mb-2 border border-slate-200">
                                                    <div>
                                                        <span className="font-black text-slate-800">{c.trainer}</span>
                                                        <span className="mx-2 text-slate-400">·</span>
                                                        <span className="text-sm text-slate-600">{c.startDate} → {c.endDate}</span>
                                                        <span className="ml-2 text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-black">{c.type}</span>
                                                    </div>
                                                    <button onClick={()=>supprimerConge(c.id)} className="text-slate-400 hover:text-rose-600 p-2"><Icone nom="poubelle" taille={14}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODALE EDITION */}
                        {modalEditionMode && peutEditer && (
                            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-50 p-6">
                                <div className="bg-white rounded-[3rem] w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                                    <div className={`p-8 text-white flex justify-between items-center ${modalEditionMode==='PSF'?'bg-emerald-600':(modalEditionMode==='TTT'?'bg-amber-500':'bg-[#0f172a]')}`}>
                                        <h2 className="text-xl font-black uppercase flex items-center gap-2">
                                            {modalEditionMode==='PSF'?<Icone nom="medaille" taille={24}/>:(modalEditionMode==='TTT'?<Icone nom="livre" taille={24}/>:<Icone nom="calendrier" taille={24}/>)}
                                            {editionEnCours?'Modifier':'Nouvelle'} session {modalEditionMode!=='standard'?modalEditionMode:''}
                                        </h2>
                                        <button onClick={()=>setModalEditionMode(null)} className="text-3xl font-black">×</button>
                                    </div>
                                    <div className="p-8 flex-1 overflow-y-auto custom-scrollbar">
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="col-span-2"><Field l="Désignation"><TInput v={(modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).name} onChange={v=>modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,name:v})):setNouvelleFormation(p=>({...p,name:v}))} ph="Nom de la session..."/></Field></div>
                                            <Field l="Statut"><TSelect v={(modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).status} onChange={v=>modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,status:v})):setNouvelleFormation(p=>({...p,status:v}))} opts={STATUTS}/></Field>
                                            <Field l="Site"><TSelect v={(modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).site} onChange={v=>modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,site:v})):setNouvelleFormation(p=>({...p,site:v}))} opts={modalEditionMode==='standard'?SITES:SITES_TTT}/></Field>
                                            {modalEditionMode==='standard' && <Field l="Type"><TSelect v={nouvelleFormation.type} onChange={v=>setNouvelleFormation(p=>({...p,type:v}))} opts={TYPES}/></Field>}
                                            {modalEditionMode!=='PSF' && <Field l="Date début"><TInput t="date" v={nouvelleFormation.startDate} onChange={v=>setNouvelleFormation(p=>({...p,startDate:v,week:'S'+getISOWeek(new Date(v))}))}/></Field>}
                                            {modalEditionMode==='PSF' && (
                                                <div className="col-span-2 bg-emerald-50 p-5 rounded-2xl border border-emerald-200">
                                                    <label className="text-[10px] font-black uppercase text-emerald-700 mb-3 block">Dates de la formation</label>
                                                    <div className="flex gap-2 mb-3"><TInput t="date" v={dateTemp} onChange={setDateTemp}/><button onClick={()=>{if(dateTemp&&!(nouvelleFormationPSF.dates||[]).includes(dateTemp)){updatePSFDates([...(nouvelleFormationPSF.dates||[]),dateTemp]);setDateTemp('');}}} className="bg-emerald-700 text-white px-4 rounded-xl font-black text-xs">+ Date</button></div>
                                                    <div className="flex flex-wrap gap-2">{(nouvelleFormationPSF.dates||[]).map(d=><span key={d} className="bg-white border border-emerald-200 px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-2">{d}<button onClick={()=>updatePSFDates((nouvelleFormationPSF.dates||[]).filter(x=>x!==d))} className="text-rose-500">×</button></span>)}</div>
                                                </div>
                                            )}
                                            <Field l={`Durée ${modalEditionMode==='standard'&&nouvelleFormation.type!=='Projet Genesys'?'(jours)':'(min)'}`}>
                                                {modalEditionMode==='standard'&&nouvelleFormation.type==='Projet Genesys'?<TSelect v={nouvelleFormation.duration} onChange={v=>setNouvelleFormation(p=>({...p,duration:parseFloat(v)}))} opts={GENESYS_DUREES}/>:modalEditionMode==='standard'?<TInput t="number" v={nouvelleFormation.duration} onChange={v=>setNouvelleFormation(p=>({...p,duration:parseFloat(v)||0}))}/>:<TSelect v={Math.round(((modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).duration||0)*JOUR_EN_MINUTES)} onChange={v=>{const val=parseInt(v)/JOUR_EN_MINUTES;modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,duration:val})):setNouvelleFormation(p=>({...p,duration:val}));}} opts={MINUTES_PSF.map(m=>({val:m,label:`${m} min`}))}/>}
                                            </Field>
                                            {modalEditionMode==='TTT' ? (
                                                <div className="col-span-2 bg-amber-50 p-5 rounded-2xl border border-amber-200">
                                                    <label className="text-[10px] font-black uppercase text-amber-700 mb-3 block">Formateurs concernés</label>
                                                    <div className="flex flex-wrap gap-2">{['Tous les formateurs',...TRAINERS].map(c=><label key={c} className={`flex items-center gap-2 text-xs font-bold px-4 py-2 rounded-xl cursor-pointer border transition-colors ${(nouvelleFormation.cible||[]).includes(c)?'bg-amber-500 border-amber-600 text-white':'bg-white border-slate-200 text-slate-600'}`}><input type="checkbox" className="hidden" checked={(nouvelleFormation.cible||[]).includes(c)} onChange={e=>{const nc=e.target.checked?[...(nouvelleFormation.cible||[]),c]:(nouvelleFormation.cible||[]).filter(x=>x!==c);setNouvelleFormation({...nouvelleFormation,cible:nc,trainer:nc.join(', ')});}}/>{c}</label>)}</div>
                                                </div>
                                            ) : (
                                                <Field l="Formateur"><TSelect v={(modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).trainer} onChange={v=>modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,trainer:v})):setNouvelleFormation(p=>({...p,trainer:v}))} opts={TRAINERS}/></Field>
                                            )}
                                            {modalEditionMode!=='TTT' && (
                                                <>
                                                    <Field l="Agents Prévus"><TInput t="number" v={(modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).agents} onChange={v=>modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,agents:v})):setNouvelleFormation(p=>({...p,agents:v}))}/></Field>
                                                    <Field l="Agents Formés" c="text-emerald-600"><TInput t="number" v={(modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).agentsRealises} onChange={v=>modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,agentsRealises:v})):setNouvelleFormation(p=>({...p,agentsRealises:v}))}/></Field>
                                                </>
                                            )}
                                            <div className="col-span-2"><label className="text-[10px] font-black uppercase text-slate-400 mb-2 block">Commentaire</label><textarea className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 font-bold outline-none min-h-[80px] text-xs resize-none focus:ring-2 focus:ring-blue-500" value={(modalEditionMode==='PSF'?nouvelleFormationPSF:nouvelleFormation).comment||''} onChange={e=>{const v=e.target.value;modalEditionMode==='PSF'?setNouvelleFormationPSF(p=>({...p,comment:v})):setNouvelleFormation(p=>({...p,comment:v}));}} placeholder="Notes..."/></div>
                                        </div>
                                    </div>
                                    <div className="p-8 bg-slate-50 flex justify-end gap-4 border-t border-slate-100">
                                        <button onClick={()=>setModalEditionMode(null)} className="font-black text-xs uppercase text-slate-400 px-6 py-3 hover:text-slate-800 rounded-xl">Annuler</button>
                                        <button onClick={validerFormation} className={`text-white px-10 py-4 rounded-2xl font-black text-xs shadow-xl active:scale-95 transition-all uppercase ${modalEditionMode==='PSF'?'bg-emerald-600 hover:bg-emerald-500':(modalEditionMode==='TTT'?'bg-amber-500 hover:bg-amber-400':'bg-blue-600 hover:bg-blue-500')}`}>
                                            {editionEnCours?'Mettre à jour':'Enregistrer'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

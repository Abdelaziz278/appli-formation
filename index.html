        const parseCSV = (str) => {
            const arr = []; let quote = false; let row = 0, col = 0, c = 0;
            for (; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';
                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { ++col; continue; }
                if ((cc === '\r' && nc === '\n') && !quote) { ++row; col = 0; ++c; continue; }
                if ((cc === '\n' || cc === '\r') && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        const getMonthYear = (dateStr) => {
            if (!dateStr) return 'Inconnu';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return 'Inconnu';
            return d.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });
        };

        const getISOWeek = (d) => {
            if (!(d instanceof Date) || isNaN(d.getTime())) return 0;
            const date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        };

        const getDaysForWeek = (weekStr) => {
            if (!weekStr) return Array(5).fill({name: '-', date: '-'});
            const currentYear = new Date().getFullYear();
            const weekMatch = String(weekStr).match(/\d+/);
            if (!weekMatch) return Array(5).fill({name: '-', date: '-'});
            const weekNum = parseInt(weekMatch[0], 10);
            const simple = new Date(currentYear, 0, 1 + (weekNum - 1) * 7);
            const dow = simple.getDay();
            const ISOweekStart = simple;
            if (dow <= 4) ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
            else ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
            const days = [];
            const dayNames = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
            for(let i=0; i<5; i++) {
                const d = new Date(ISOweekStart);
                d.setDate(d.getDate() + i);
                days.push({ name: dayNames[i], date: d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) });
            }
            return days;
        };
        
        const getWeekDateRange = (weekStr) => {
            if (!weekStr) return null;
            const weekMatch = String(weekStr).match(/\d+/);
            if (!weekMatch) return null;
            const weekNum = parseInt(weekMatch[0], 10);
            const currentYear = new Date().getFullYear();
            const simple = new Date(currentYear, 0, 1 + (weekNum - 1) * 7);
            const dow = simple.getDay();
            const ISOweekStart = simple;
            if (dow <= 4) ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
            else ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
            const monday = new Date(ISOweekStart);
            const sunday = new Date(ISOweekStart);
            sunday.setDate(sunday.getDate() + 6);
            const format = d => {
                const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            };
            return { min: format(monday), max: format(sunday) };
        };
        
        const calculerNiveaux = (formSite) => {
            const sorted = [...formSite].sort((a, b) => {
                const da = new Date(a?.startDate || 0).getTime();
                const db = new Date(b?.startDate || 0).getTime();
                return (isNaN(da) ? 0 : da) - (isNaN(db) ? 0 : db);
            });
            const levels = [];
            return sorted.map(t => {
                const start = new Date(t?.startDate || 0);
                if (isNaN(start.getTime())) return { ...t, level: 0 };
                const end = new Date(start); 
                end.setDate(start.getDate() + (parseFloat(t?.duration) || 0));
                let level = 0; 
                while (levels[level] && levels[level] > start) { level++; }
                levels[level] = end; 
                return { ...t, level };
            });
        };

            if (!t) return '0 j';
            if (t.type === 'PSF' || t.isTTT) return `${Math.round((parseFloat(t.duration) || 0) * 420)} min`;

                if (Math.abs(val - 3.5/7) < 0.01) return '3h30';

                if (Math.abs(val - 1) < 0.01) return '1 journée';
                if (Math.abs(val - 1.5) < 0.01) return '1.5 jrs';

                checkAnonymous();

                    if (currentUser) {
                        setUser(currentUser);
                        if (currentUser.isAnonymous) {
                            setUserRole('Lecture seule');
                            setLoading(false);
                        } else {
                            try {
                                const roleDocRef = doc(db, 'artifacts', artifactAppId, 'public', 'data', 'userRoles', currentUser.uid);

                                if (roleDoc.exists()) {

                                } else {

                                }

                            }
                            setLoading(false);
                        }
                    } else {
                        setUser(null);
                        setUserRole(null);
                        setLoading(false);
                    }
                });
                return () => unsubscribe();
            }, []);

                    </div>
                );

            if (!user) {
                return <EcranAuthentification />;
            }

            return <OutilPilotage user={user} userRole={userRole} setUserRole={setUserRole} />;

            const [password, setPassword] = useState('');
            const [erreur, setErreur] = useState('');
            const [chargement, setChargement] = useState(false);
            const [succes, setSucces] = useState('');

            const gererSoumission = async (e) => {
                e.preventDefault();
                setErreur(''); setSucces(''); setChargement(true);
                try {
                    if (estInscription) {
                        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                        await setDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', 'userRoles', userCredential.user.uid), {
                            email: email, role: 'Lecture seule', dateCreation: Date.now()
                        });
                        setSucces('Compte créé avec succès !');
                        setTimeout(() => setEstInscription(false), 2000);
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                    }
                } catch (error) {
                    switch (error.code) {
                        case 'auth/invalid-email': setErreur('Adresse email invalide.'); break;
                        case 'auth/user-not-found': setErreur('Aucun compte trouvé.'); break;
                        case 'auth/wrong-password': setErreur('Mot de passe incorrect.'); break;
                        case 'auth/email-already-in-use': setErreur('Cet email est déjà utilisé.'); break;
                        case 'auth/weak-password': setErreur('Le mot de passe doit faire au moins 6 caractères.'); break;
                        default: setErreur('Erreur : ' + error.message);
                    }
                } finally { setChargement(false); }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200">
                        <div className="bg-[#0f172a] p-10 text-center relative overflow-hidden">
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-screen filter blur-[40px] opacity-40"></div>
                            <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-emerald-500 rounded-full mix-blend-screen filter blur-[40px] opacity-40"></div>
                            <div className="relative z-10">
                                <img src="logo.png" onError={(e)=>{e.target.onerror=null; e.target.src="https://upload.wikimedia.org/wikipedia/commons/4/42/Nespresso_logo.svg"}} alt="Nespresso" className="h-16 w-16 rounded-2xl shadow-lg object-cover mx-auto mb-4 bg-black border border-slate-800" />
                                <h2 className="text-2xl font-black text-white uppercase tracking-widest">{estInscription ? 'Créer un accès' : 'Espace Sécurisé'}</h2>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mt-2">Pilotage Formation Nespresso</p>
                            </div>
                        </div>
                        <div className="p-8">
                            {erreur && <div className="mb-6 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-700 text-xs font-bold rounded-r-lg flex items-center gap-2"><Icone nom="alerte-triangle" taille={16}/>{erreur}</div>}
                            {succes && <div className="mb-6 p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 text-xs font-bold rounded-r-lg flex items-center gap-2"><Icone nom="cercle-ok" taille={16}/>{succes}</div>}
                            <form onSubmit={gererSoumission} className="space-y-5">
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Email professionnel</label>
                                    <div className="relative">
                                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icone nom="mail" taille={18} /></div>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-500 transition-all" placeholder="prenom.nom@concentrix.com" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Mot de passe</label>
                                    <div className="relative">
                                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icone nom="lock" taille={18} /></div>
                                        <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-500 transition-all" placeholder="••••••••" />
                                    </div>
                                </div>
                                <button type="submit" disabled={chargement} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 px-4 rounded-xl flex justify-center items-center gap-2 uppercase tracking-widest text-xs mt-6 transition-all shadow-xl shadow-blue-600/20 active:scale-95 disabled:opacity-50">
                                    {chargement ? <Icone nom="chargement" classe="animate-spin" taille={18} /> : estInscription ? <><Icone nom="user-plus" taille={18} /> Demander un accès</> : <><Icone nom="log-in" taille={18} /> Connexion</>}
                                </button>
                            </form>
                            <div className="mt-8 text-center">
                                <button onClick={() => { setEstInscription(!estInscription); setErreur(''); setSucces(''); }} className="text-xs font-bold text-slate-500 hover:text-blue-600 transition-colors underline underline-offset-4">
                                    {estInscription ? "J'ai déjà un compte, me connecter" : "Je n'ai pas de compte, faire une demande"}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- OUTIL PRINCIPAL ---
        function OutilPilotage({ user, userRole, setUserRole }) {
            const peutEditer = userRole === 'Admin' || userRole === 'Manager';

            // ✅ CORRECTION : variable correctement nommée "environnement"
            const [environnement, setEnvironnement] = useState('B2C');
            const environnementRef = useRef(environnement);
            useEffect(() => { environnementRef.current = environnement; }, [environnement]);

            const getDbInfo = () => ({
                colName: environnement === 'B2C' ? 'formations' : 'formations_b2b',
                localKey: environnement === 'B2C' ? 'pilotage_b2c_data' : 'pilotage_b2b_data'
            });

            const [chargement, setChargement] = useState(true);
            const [formations, setFormations] = useState([]);
            const [vue, setVue] = useState('accueil');
            const [conges, setConges] = useState([]);
            const [modalConge, setModalConge] = useState(false);
            const defaultConge = { trainer: 'Rachid', startDate: new Date().toISOString().split('T')[0], endDate: new Date().toISOString().split('T')[0], type: 'Congé Annuel', comment: '' };
            const [nouveauConge, setNouveauConge] = useState(defaultConge);

            const timelineRef = useRef(null); 
            const baseFiltres = { sites: [], budgets: [], statuts: [], semaines: [], mois: [], types: [], noms: [] };
            const [filtresParVue, setFiltresParVue] = useState({
                accueil: { ...baseFiltres }, suivi: { ...baseFiltres }, selection: { ...baseFiltres },
                psf: { ...baseFiltres }, spe: { ...baseFiltres }, fim: { ...baseFiltres },
                genesys: { ...baseFiltres }, ttt: { ...baseFiltres }, chronologie: { ...baseFiltres }, planning: { ...baseFiltres }
            });
            const filtres = filtresParVue[vue] || baseFiltres;
            const setFiltres = (nouveauxFiltres) => setFiltresParVue(prev => ({ ...prev, [vue]: nouveauxFiltres }));
            
            const [modalAjout, setModalAjout] = useState(false);
            const [modalAjoutPSF, setModalAjoutPSF] = useState(false);
            const [modalTTT, setModalTTT] = useState(false);
            const [modalMultiple, setModalMultiple] = useState(false);
            const [modalMultiplePSF, setModalMultiplePSF] = useState(false);
            const [modalMultipleTTT, setModalMultipleTTT] = useState(false);
            const [editionEnCours, setEditionEnCours] = useState(false);
            const [lastAutoSave, setLastAutoSave] = useState(null);
            const [afficherImportExcel, setAfficherImportExcel] = useState(false);
            const [texteImport, setTexteImport] = useState('');
            const [dateTemp, setDateTemp] = useState('');
            const [lignesMultiples, setLignesMultiples] = useState([]);
            const [lignesMultiplesPSF, setLignesMultiplesPSF] = useState([]);
            const [lignesMultiplesTTT, setLignesMultiplesTTT] = useState([]);

            const defaultFormation = {
                name: '', type: 'Formation continue', week: 'S12', site: 'Rabat', trainer: 'Rachid', funding: 'Concentrix', 
                agents: 12, agentsRealises: 0, duration: 1, startDate: new Date().toISOString().split('T')[0], 
                status: 'Planifié', comment: '', isValidated: false, isTTT: false, cible: []
            };
            const defaultFormationPSF = { ...defaultFormation, type: 'PSF', duration: 60/JOUR_EN_MINUTES, dates: [], cible: [], deadline: '' };

            const [nouvelleFormation, setNouvelleFormation] = useState(defaultFormation);
            const [nouvelleFormationPSF, setNouvelleFormationPSF] = useState(defaultFormationPSF);
            
            useEffect(() => {
                setChargement(true);
                const { colName } = getDbInfo();
                const unsubscribe = onSnapshot(collection(db, 'artifacts', artifactAppId, 'public', 'data', colName), (snap) => {
                    setFormations(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setChargement(false);
                });
                return () => unsubscribe();
            }, [environnement]);

            useEffect(() => {
                const unsubConges = onSnapshot(collection(db, 'artifacts', artifactAppId, 'public', 'data', 'conges'), (snap) => {
                    setConges(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsubConges();
            }, []);

            const currentWeekNum = useMemo(() => getISOWeek(new Date()), []);

            const passeFiltres = (t) => {
                if (!t) return false;
                if (filtres.sites?.length && !filtres.sites.includes(t.site)) return false;
                if (filtres.statuts?.length && !filtres.statuts.includes(t.status)) return false;
                if (filtres.types?.length && !filtres.types.includes(t.type)) return false;
                if (filtres.noms?.length && !filtres.noms.includes(t.name)) return false;
                if (filtres.semaines?.length && (!t.week || !filtres.semaines.some(sw => t.week.includes(sw)))) return false;
                if (filtres.mois?.length && !filtres.mois.includes(getMonthYear(t.startDate))) return false;
                return true;
            };

            const formationsFiltrees = useMemo(() => formations.filter(t => !t?.isTTT && passeFiltres(t)).sort((a, b) => String(a?.week || '').localeCompare(String(b?.week || ''), undefined, { numeric: true })), [formations, filtres]);
            const formationsPSF = useMemo(() => formations.filter(t => t?.type === 'PSF' && !t?.isTTT && passeFiltres(t)).sort((a, b) => String(a?.week || '').localeCompare(String(b?.week || ''), undefined, { numeric: true })), [formations, filtres]);
            const formationsTTT = useMemo(() => formations.filter(t => t?.isTTT && passeFiltres(t)).sort((a, b) => String(a?.week || '').localeCompare(String(b?.week || ''), undefined, { numeric: true })), [formations, filtres]);

            // ✅ CORRECTION : utilisation de "ensembleStats" (plus de "fStats")
            const ensembleStats = useMemo(() => {
                const base = formationsFiltrees.filter(f => f?.status !== 'Annulé');
                const total = base.length;
                const terminees = base.filter(f => f?.status === 'Terminé').length;
                const taux = total > 0 ? Math.round((terminees / total) * 100) : 0;
                return { total, terminees, enCours: base.filter(f => f?.status === 'En cours').length, planifiees: base.filter(f => ['Planifié', 'À planifier', 'En attente de validation'].includes(f?.status)).length, taux };
            }, [formationsFiltrees]);

            // ✅ CORRECTION : "bilanMensuelData" ajouté
            const bilanMensuelData = useMemo(() => {
                const moisCourant = getMonthYear(new Date().toISOString());
                return formations.filter(f => getMonthYear(f?.startDate) === moisCourant && f?.status !== 'Annulé' && passeFiltres(f));
            }, [formations, filtres]);

            const chronologieDonnees = useMemo(() => {
                const now = new Date(); now.setHours(0,0,0,0);
                let start = new Date(now); start.setDate(now.getDate() - 7); 
                let end = new Date(start); end.setDate(end.getDate() + 90); 
                const dates = formations.filter(t => t?.type !== 'PSF').map(t => new Date(t?.startDate || 0)).filter(d => !isNaN(d.getTime())).sort((a, b) => a - b);
                if (dates.length > 0) {
                    if (dates[0] < start) { start = new Date(dates[0]); start.setDate(start.getDate() - 7); }
                    const lastDate = new Date(dates[dates.length - 1]); lastDate.setDate(lastDate.getDate() + 30); 
                    if (lastDate > end) end = lastDate;
                }
                const totalSpan = Math.max(90, Math.ceil((end - start) / (1000 * 3600 * 24)));
                const days = Array.from({ length: totalSpan }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
                return { start, days, totalSpan };
            }, [formations]);

            const suiviDonnees = useMemo(() => {
                const base = formations.filter(t => !t?.isTTT && t?.status !== 'Annulé' && passeFiltres(t));
                const typesSet = new Set();
                let grandTotal = 0; const colTotals = {};
                base.forEach(t => {
                    const type = t.type || 'Autre';
                    const hours = (parseFloat(t.duration) || 0) * 7 * (parseInt(t.agents) || 0);
                    if (!colTotals[type]) colTotals[type] = 0;
                    colTotals[type] += hours; typesSet.add(type); grandTotal += hours;
                });
                return { types: Array.from(typesSet).sort(), colTotals, grandTotal };
            }, [formations, filtres]);

            const heuresParSite = useMemo(() => {
                let rabat = 0, meknes = 0;
                formations.filter(t => !t?.isTTT && t?.status !== 'Annulé' && passeFiltres(t)).forEach(t => {
                    const h = (parseFloat(t.duration) || 0) * 7 * (parseInt(t.agents) || 0);
                    if (t.site === 'Rabat') rabat += h;
                    else if (t.site === 'Meknès') meknes += h;
                    else { rabat += h/2; meknes += h/2; } 
                });
                return { rabat, meknes };
            }, [formations, filtres]);

            const carteConflits = useMemo(() => {
                const map = {};
                formations.filter(t => t?.type !== 'PSF').forEach(t => {
                    if(!t || !t.week) return;
                    if (t.isTTT && t.cible?.length > 0) {
                        t.cible.forEach(c => { if(c !== 'Tous les formateurs') { const cle = `${c}-${t.week}`; if (!map[cle]) map[cle] = []; map[cle].push(t.id); } });
                    } else if (t.trainer) {
                        const cle = `${t.trainer}-${t.week}`; if (!map[cle]) map[cle] = []; map[cle].push(t.id);
                    }
                });
                return map;
            }, [formations]);

            const hasConflict = (t) => {
                if (!t) return false;
                if (t.isTTT && t.cible?.length > 0) return t.cible.some(c => carteConflits[`${c}-${t.week}`]?.length > 1);
                return carteConflits[`${t.trainer}-${t.week}`]?.length > 1;
            };

            // ✅ CORRECTION : fonctions manquantes ajoutées
            const { colName } = getDbInfo();

            const openEditModal = (t) => {
                if (!peutEditer) return;
                setEditionEnCours(true);
                if (t.type === 'PSF') {
                    setNouvelleFormationPSF(t);
                    setModalAjoutPSF(true);
                } else if (t.isTTT) {
                    setNouvelleFormation(t);
                    setModalTTT(true);
                } else {
                    setNouvelleFormation(t);
                    setModalAjout(true);
                }
            };

            const deleteTraining = async (id) => {
                if (!peutEditer) return;
                if (!window.confirm('Supprimer cette session ?')) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', colName, id));
                } catch(e) { console.error('Erreur suppression:', e); }
            };

            const mettreAJourStatutDirect = async (id, status) => {
                if (!peutEditer) return;
                try {
                    await updateDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', colName, id), { status });
                } catch(e) { console.error('Erreur mise à jour statut:', e); }
            };

            const updatePSFDates = (dates) => {
                const firstDate = [...dates].sort()[0] || nouvelleFormationPSF.startDate;
                setNouvelleFormationPSF({ ...nouvelleFormationPSF, dates, startDate: firstDate, week: 'S' + getISOWeek(new Date(firstDate)) });
            };

            const handleExtraireCSV = () => {
                const exportData = formations.filter(passeFiltres).sort((a,b) => (new Date(a.startDate).getTime() - new Date(b.startDate).getTime()));
                const entetes = ["Mois", "Semaine", "Formation", "Type", "Site", "Statut", "Formateur", "Date Debut", "Duree Initiale", "Agents Prevus", "Agents Formes", "Heures Prevues", "Heures Realisees", "Prise en charge", "Commentaire"];
                const lignes = exportData.map(t => {
                    const hPrevues = (parseFloat(t.duration) || 0) * 7 * (parseInt(t.agents) || 0);
                    const hRealisees = (parseFloat(t.duration) || 0) * 7 * (parseInt(t.agentsRealises) || 0);
                    return [
                        `"${getMonthYear(t.startDate)}"`, `"${t.week || ''}"`, `"${t.name || ''}"`, `"${t.type || ''}"`, `"${t.site || ''}"`, `"${t.status || ''}"`, 
                        `"${t.trainer || ''}"`, `"${t.startDate || ''}"`, `"${formaterDuree(t)}"`, t.agents || 0, t.agentsRealises || 0, 
                        Math.round(hPrevues * 10) / 10, Math.round(hRealisees * 10) / 10, `"${t.funding || ''}"`, `"${(t.comment || '').replace(/"/g, '""')}"`
                    ].join(";");
                });
                const csvStr = "\ufeff" + [entetes.join(";"), ...lignes].join("\n");
                const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const lien = document.createElement("a"); lien.setAttribute("href", url); 
                lien.setAttribute("download", `Extraction_Pilotage_${environnement}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(lien); lien.click(); document.body.removeChild(lien);
            };

            const validerFormation = async () => {
                const isPSF = modalAjoutPSF;
                const fToSave = isPSF ? nouvelleFormationPSF : nouvelleFormation;
                if(!fToSave.name) return;
                const payload = { ...fToSave, duration: parseFloat(fToSave.duration) || 0, agents: parseInt(fToSave.agents) || 0, agentsRealises: parseInt(fToSave.agentsRealises) || 0, updatedAt: new Date().toISOString() };
                try {
                    if (editionEnCours) {
                        await updateDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', colName, fToSave.id), payload);
                    } else {
                        await setDoc(doc(db, 'artifacts', artifactAppId, 'public', 'data', colName, Date.now().toString()), { ...payload, id: Date.now().toString() });
                    }
                } catch(e) { console.error('Erreur sauvegarde:', e); }
                setModalAjout(false); setModalTTT(false); setModalAjoutPSF(false); setEditionEnCours(false);
                setNouvelleFormation(defaultFormation); setNouvelleFormationPSF(defaultFormationPSF);
            };

            const renderTableEnsemble = (data) => (
                <div className="overflow-x-auto">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Semaine</th>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Formation</th>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400 text-center">Statut</th>
                                <th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {data.length === 0 && (
                                <tr><td colSpan={4} className="px-6 py-10 text-center text-slate-400 font-bold text-sm">Aucune session</td></tr>
                            )}
                            {data.map(t => {
                                const progress = t.agents > 0 ? Math.min(100, Math.round(((t.agentsRealises || 0) / t.agents) * 100)) : 0;
                                return (
                                    <tr key={t.id} className="hover:bg-slate-50 transition-colors">
                                        <td className="px-6 py-5 font-black text-blue-600">{t.week}</td>
                                        <td className="px-6 py-5">
                                            <div className="font-black text-slate-800 uppercase">{t.name}</div>
                                            <div className="text-[10px] font-bold text-slate-400 uppercase mt-1">{t.type} • {t.trainer}</div>
                                        </td>
                                        <td className="px-6 py-5 text-center">
                                            {peutEditer ? (
                                                <select value={t.status} onChange={(e) => mettreAJourStatutDirect(t.id, e.target.value)} className={`px-2 py-1 rounded-full text-[9px] font-black uppercase border ${getStatusColor(t.status)} outline-none`}>
                                                    {STATUTS.map(s => <option key={s}>{s}</option>)}
                                                </select>
                                            ) : (
                                                <span className={`px-2 py-1 rounded-full text-[9px] font-black uppercase border ${getStatusColor(t.status)}`}>{t.status}</span>
                                            )}
                                            <div className="mt-2 w-24 mx-auto bg-slate-100 h-1 rounded-full overflow-hidden">
                                                <div className="bg-blue-500 h-full transition-all" style={{width:`${progress}%`}}></div>
                                            </div>
                                        </td>
                                        <td className="px-6 py-5 text-right space-x-2">
                                            {peutEditer && <button onClick={()=>openEditModal(t)} className="text-slate-300 hover:text-emerald-600"><Icone nom="modifier" taille={16}/></button>}
                                            {peutEditer && <button onClick={()=>deleteTraining(t.id)} className="text-slate-300 hover:text-rose-500"><Icone nom="poubelle" taille={16}/></button>}
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );

            const renderSpecificTable = (data, weekColor) => (
                <div className="overflow-x-auto">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="px-4 py-4 text-[10px] font-black uppercase text-slate-400">Semaine/Date</th>
                                <th className="px-4 py-4 text-[10px] font-black uppercase text-slate-400">Désignation</th>
                                <th className="px-4 py-4 text-[10px] font-black uppercase text-slate-400 text-center">Statut</th>
                                <th className="px-4 py-4 text-[10px] font-black uppercase text-slate-400 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {data.length === 0 && (
                                <tr><td colSpan={4} className="px-6 py-10 text-center text-slate-400 font-bold text-sm">Aucune session</td></tr>
                            )}
                            {data.map(t => (
                                <tr key={t.id} className="hover:bg-slate-50">
                                    <td className={`px-4 py-4 font-black ${weekColor}`}>{t.week} <div className="text-[9px] text-slate-400">{t.startDate}</div></td>
                                    <td className="px-4 py-4 font-black text-xs uppercase">{t.name} <div className="text-[9px] font-bold text-slate-400">{t.trainer}</div></td>
                                    <td className="px-4 py-4 text-center"><span className={`px-2 py-1 rounded text-[9px] font-black uppercase ${getStatusColor(t.status)}`}>{t.status}</span></td>
                                    <td className="px-4 py-4 text-right">
                                        {peutEditer && <button onClick={()=>deleteTraining(t.id)} className="text-slate-400 hover:text-rose-500"><Icone nom="poubelle" taille={14}/></button>}
                                    </td>
                                </tr>
                            ))}
                        </tbody>

                                                <div className="flex gap-2 mb-3">
                                                    <input type="date" className="flex-1 bg-slate-50 rounded-xl p-2 font-bold outline-none border focus:ring-2 focus:ring-emerald-500" value={dateTemp} onChange={e => setDateTemp(e.target.value)}/>
                                                    <button onClick={() => { if(dateTemp && !nouvelleFormationPSF.dates.includes(dateTemp)) { updatePSFDates([...nouvelleFormationPSF.dates, dateTemp]); setDateTemp(''); } }} className="bg-slate-800 text-white px-4 rounded-xl font-black text-[10px] uppercase">Ajouter</button>
                                                </div>
                                                <div className="flex flex-wrap gap-2">
                                                    {(nouvelleFormationPSF.dates || []).map(d => (
                                                        <span key={d} className="bg-emerald-50 border border-emerald-100 px-3 py-1 rounded-lg text-xs font-bold text-emerald-800 flex items-center gap-2">
                                                            {d} <button onClick={() => updatePSFDates(nouvelleFormationPSF.dates.filter(x => x !== d))} className="text-rose-500">×</button>
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : (
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block">Date début</label>
                                                <input type="date" className="w-full bg-white border border-slate-200 rounded-xl p-3 font-bold text-xs outline-none shadow-sm" 
                                                    value={nouvelleFormation.startDate} 
                                                    onChange={e=>{ const v=e.target.value; setNouvelleFormation({...nouvelleFormation, startDate:v, week:'S'+getISOWeek(new Date(v))}); }}/>
                                            </div>
                                        )}
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block">Durée {modalAjoutPSF||modalTTT?'(min)':'(jours)'}</label>
                                            {modalAjoutPSF || modalTTT ? (
                                                <select className="w-full bg-white border border-slate-200 rounded-xl p-3 font-bold text-xs outline-none shadow-sm" 
                                                    value={Math.round((modalAjoutPSF ? nouvelleFormationPSF.duration : nouvelleFormation.duration)*420)} 
                                                    onChange={e=>{ const v=parseFloat(e.target.value)/420; modalAjoutPSF?setNouvelleFormationPSF({...nouvelleFormationPSF,duration:v}):setNouvelleFormation({...nouvelleFormation,duration:v}); }}>
                                                    {MINUTES_PSF.map(m=><option key={m} value={m}>{m} min</option>)}
                                                </select>
                                            ) : (
                                                <input type="number" step="0.1" min="0.5" className="w-full bg-white border border-slate-200 rounded-xl p-3 font-bold text-xs outline-none shadow-sm" 
                                                    value={nouvelleFormation.duration} 
                                                    onChange={e=>setNouvelleFormation({...nouvelleFormation,duration:e.target.value})}/>
                                            )}
                                        </div>
                                        {!modalTTT && (
                                            <>
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block">Agents Prévus</label>
                                                    <input type="number" min="0" className="w-full bg-white border border-slate-200 rounded-xl p-3 font-bold text-xs outline-none shadow-sm" 
                                                        value={modalAjoutPSF ? nouvelleFormationPSF.agents : nouvelleFormation.agents} 
                                                        onChange={e=>{ const v=e.target.value; modalAjoutPSF?setNouvelleFormationPSF({...nouvelleFormationPSF,agents:v}):setNouvelleFormation({...nouvelleFormation,agents:v}); }}/>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block text-emerald-600">Agents Formés (Réalisé)</label>
                                                    <input type="number" min="0" className="w-full bg-white border-2 border-emerald-100 rounded-xl p-3 font-bold text-xs outline-none shadow-sm" 
                                                        value={modalAjoutPSF ? nouvelleFormationPSF.agentsRealises : nouvelleFormation.agentsRealises} 
                                                        onChange={e=>{ const v=e.target.value; modalAjoutPSF?setNouvelleFormationPSF({...nouvelleFormationPSF,agentsRealises:v}):setNouvelleFormation({...nouvelleFormation,agentsRealises:v}); }}/>
                                                </div>
                                            </>
                                        )}
                                        <div className="col-span-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block">Notes / Justification</label>
                                            <textarea className="w-full bg-white border border-slate-200 rounded-xl p-4 font-bold text-xs outline-none min-h-[80px] resize-none" 
                                                value={modalAjoutPSF ? nouvelleFormationPSF.comment : nouvelleFormation.comment} 
                                                onChange={e=>{ const v=e.target.value; modalAjoutPSF?setNouvelleFormationPSF({...nouvelleFormationPSF,comment:v}):setNouvelleFormation({...nouvelleFormation,comment:v}); }} 
                                                placeholder="Commentaire..."/>
                                        </div>
                                    </div>
                                    <div className="p-8 bg-slate-100 flex justify-end gap-4 shadow-inner">
                                        <button onClick={() => {setModalAjout(false); setModalTTT(false); setModalAjoutPSF(false); setEditionEnCours(false);}} className="font-black text-xs uppercase text-slate-500 hover:text-slate-800 transition-colors tracking-widest px-4 py-2 rounded-xl">Annuler</button>
                                        <button onClick={validerFormation} className={`text-white px-10 py-4 rounded-2xl font-black text-xs shadow-xl active:scale-95 transition-all uppercase tracking-widest ${modalAjoutPSF?'bg-emerald-600 hover:bg-emerald-500':(modalTTT?'bg-amber-500 hover:bg-amber-400':'bg-blue-600 hover:bg-blue-500')}`}>
                                            Enregistrer la session
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilotage GRC Tersea</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        /* ------------------------------------------------------------------
           CHARTE : pour passer aux couleurs officielles Tersea, il suffit de
           modifier les variables --accent ci-dessous.
           ------------------------------------------------------------------ */
        :root {
            --accent: #0a5cff;          /* bleu des boutons Tersea */
            --accent-fonce: #0047d6;
            --accent-clair: #e3ecff;
            --violet: #7c1fd8;          /* violet de fond Tersea */
            --violet-bleu: #4a35e6;
            --vert: #00f076;            /* vert d'accent Tersea */
            --prune: #2a0f3d;           /* couleur du logo */
            --degrade: linear-gradient(160deg, #8b10d0 0%, #6a22dc 45%, #4a35e6 100%);
            --nuit: #2a0f3d;
            --nuit-2: rgba(255, 255, 255, .12);
            --fond: #f6f3fb;
            --carte: #ffffff;
            --bord: #e2e8f0;
            --encre: #0f172a;
            --encre-2: #475569;
            --encre-3: #64748b;
            /* états (toujours accompagnés d'un libellé) */
            --ok: #0ca30c;
            --alerte: #b7791f;
            --critique: #d03b3b;
            /* graphiques : une teinte, deux nuances (avant / après) */
            --serie-avant: #86b6ef;
            --serie-apres: #256abf;
            --niv-1: #cde2fb; --niv-2: #86b6ef; --niv-3: #3987e5; --niv-4: #184f95;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--fond); color: var(--encre); font-size: 14px; line-height: 1.45; }
        button, input, select, textarea { font: inherit; color: inherit; }
        h1, h2, h3, p { margin: 0; }

        .app { display: flex; min-height: 100vh; }
        .side { width: 248px; flex-shrink: 0; background: var(--degrade); color: #ece6fb; display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .marque { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; }
        .marque-logo { width: 40px; height: 40px; border-radius: 12px; background: #fff; color: var(--prune); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; overflow: hidden; }
        .marque-logo img { width: 100%; height: 100%; object-fit: cover; }
        .marque-titre { color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .02em; }
        .marque-sous { font-size: 11px; color: #d9cdf7; }
        .nav-titre { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #cdbdf5; padding: 14px 10px 6px; }
        .nav-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-radius: 12px; background: transparent; color: #ece6fb; font-weight: 600; font-size: 13px; cursor: pointer; text-align: left; }
        .nav-btn:hover { background: var(--nuit-2); color: #fff; }
        .nav-btn.actif { background: #fff; color: var(--prune); box-shadow: inset 4px 0 0 var(--vert); }
        .nav-btn .pastille { margin-left: auto; background: var(--critique); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
        .side-bas { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--nuit-2); font-size: 12px; }
        .side-bas .qui { padding: 0 10px 10px; color: #d9cdf7; word-break: break-all; }
        .side-bas .qui b { color: #fff; display: block; }

        .main { flex: 1; min-width: 0; padding: 24px 28px 60px; }
        .entete { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        .entete h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; color: var(--prune); }
        .entete p { color: var(--encre-3); font-size: 13px; margin-top: 2px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .bandeau { border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid; }
        .bandeau.alerte { background: #fffbeb; border-color: #fcd34d; color: #78350f; }
        .bandeau.info { background: var(--accent-clair); border-color: #93c5fd; color: #1e3a8a; }
        .bandeau.erreur { background: #fef2f2; border-color: #fca5a5; color: #7f1d1d; }

        .filtres { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; }
        .filtres .champ { min-width: 150px; }
        .champ { display: flex; flex-direction: column; gap: 4px; }
        .champ > span, .label { font-size: 11px; font-weight: 700; color: var(--encre-3); text-transform: uppercase; letter-spacing: .05em; }
        .input { border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 10px; background: #fff; width: 100%; min-height: 38px; }
        .input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
        textarea.input { min-height: 70px; resize: vertical; }

        .btn { border: 1px solid #cbd5e1; background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 38px; }
        .btn:hover { background: #f8fafc; }
        .btn.primaire { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primaire:hover { background: var(--accent-fonce); }
        .btn.danger { color: var(--critique); border-color: #fca5a5; }
        .btn.mini { padding: 4px 9px; min-height: 30px; font-size: 12px; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn.sombre { background: var(--nuit-2); border-color: transparent; color: #fff; width: 100%; justify-content: center; margin-bottom: 6px; }
        .btn.sombre:hover { color: #fff; background: rgba(255, 255, 255, .22); }

        .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; }
        .carte h2 { font-size: 15px; font-weight: 700; }
        .carte .sous { color: var(--encre-3); font-size: 12px; margin-top: 2px; margin-bottom: 12px; }

        .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
        @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); } }
        .kpi { background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; padding: 16px 18px; }
        .kpi .lib { font-size: 12px; color: var(--encre-2); font-weight: 600; min-height: 34px; }
        .kpi .val { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
        .kpi .val small { font-size: 15px; font-weight: 700; color: var(--encre-3); margin-left: 2px; }
        .kpi .det { font-size: 12px; color: var(--encre-3); margin-top: 2px; }
        .jauge { height: 6px; background: #e2e8f0; border-radius: 99px; margin-top: 10px; overflow: hidden; }
        .jauge > div { height: 100%; background: var(--violet); border-radius: 99px; }

        .tab-wrap { overflow-x: auto; }
        table.tab { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.tab th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--encre-3); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--bord); white-space: nowrap; }
        table.tab td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        table.tab tr:hover td { background: #f8fafc; }
        table.tab td.num, table.tab th.num { text-align: right; font-variant-numeric: tabular-nums; }
        table.tab td.centre, table.tab th.centre { text-align: center; }
        table.tab td.centre { white-space: nowrap; }
        .vide { text-align: center; color: var(--encre-3); padding: 28px 10px; }

        .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: #e2e8f0; color: #334155; white-space: nowrap; }
        .badge.ok { background: #dcfce7; color: #14532d; }
        .badge.attente { background: #dbeafe; color: #1e3a8a; }
        .badge.ko { background: #fee2e2; color: #7f1d1d; }
        .badge.alerte { background: #fef3c7; color: #78350f; }

        .niv { display: inline-flex; width: 30px; height: 26px; align-items: center; justify-content: center; border-radius: 7px; font-weight: 700; font-size: 12px; }
        .niv.n0 { background: #f1f5f9; color: #94a3b8; }
        .niv.n1 { background: var(--niv-1); color: #0d366b; }
        .niv.n2 { background: var(--niv-2); color: #0d366b; }
        .niv.n3 { background: var(--niv-3); color: #fff; }
        .niv.n4 { background: var(--niv-4); color: #fff; }
        .legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--encre-2); align-items: center; margin-bottom: 10px; }
        .legende span { display: inline-flex; align-items: center; gap: 6px; }
        .puce { width: 12px; height: 12px; border-radius: 99px; display: inline-block; }

        /* Graphique avant / après (haltères) */
        .halt { display: grid; grid-template-columns: minmax(130px, 220px) 1fr 110px; gap: 12px; align-items: center; padding: 7px 0; }
        .halt .nom { font-size: 13px; }
        .halt .piste { position: relative; height: 22px; }
        .halt .piste::before { content: ''; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #e2e8f0; }
        .halt .lien { position: absolute; top: 9px; height: 4px; background: var(--serie-avant); border-radius: 4px; }
        .halt .pt { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 99px; border: 2px solid #fff; }
        .halt .pt.avant { background: var(--serie-avant); }
        .halt .pt.apres { background: var(--serie-apres); }
        .halt .chiffres { font-size: 12px; color: var(--encre-2); text-align: right; font-variant-numeric: tabular-nums; }
        .halt .chiffres b { color: var(--encre); }
        .axe { display: grid; grid-template-columns: minmax(130px, 220px) 1fr 110px; gap: 12px; font-size: 11px; color: var(--encre-3); }
        .axe .grad { display: flex; justify-content: space-between; }
        [data-bulle] { position: relative; }
        [data-bulle]:hover::after { content: attr(data-bulle); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--nuit); color: #fff; font-size: 11px; font-weight: 500; padding: 5px 9px; border-radius: 7px; white-space: nowrap; z-index: 20; pointer-events: none; }

        .modal-fond { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; z-index: 50; overflow-y: auto; }
        .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 760px; padding: 22px 24px; }
        .modal h2 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
        .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .pleine { grid-column: 1 / -1; }
        .modal-pied { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .coche { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .coche input { width: 17px; height: 17px; accent-color: var(--accent); }
        .liste-part { max-height: 260px; overflow-y: auto; border: 1px solid var(--bord); border-radius: 10px; }
        .sec { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--encre-2); margin: 14px 0 8px; }

        .semaine { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 10px; }
        .jour { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 10px; min-height: 180px; }
        .jour.auj { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .jour-tete { font-size: 12px; font-weight: 700; color: var(--encre-2); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .evt { border-left: 3px solid var(--violet); background: #f8fafc; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; cursor: pointer; }
        .evt.acc { border-left-color: #64748b; }
        .evt.conflit { background: #fef2f2; border-left-color: var(--critique); }
        .evt b { display: block; font-size: 12px; }
        .evt span { color: var(--encre-3); }

        .auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--degrade); }
        .auth-carte { background: #fcf9ff; border-radius: 32px; width: 100%; max-width: 440px; overflow: hidden; box-shadow: 0 24px 60px rgba(30, 5, 70, .35); }
        .auth-tete { color: var(--prune); padding: 36px 32px 4px; }
        .auth-tete h2 { font-size: 22px; font-weight: 800; margin-top: 22px; }
        .auth-tete p { color: var(--encre-3); font-size: 13px; margin-top: 4px; }
        .auth-tete .marque-logo { background: var(--prune); color: #fff; }
        .auth-tete .marque-logo img { background: #fcf9ff; }
        .auth-tete .bienvenue { display: inline-block; background: var(--prune); color: var(--vert); font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; margin-top: 14px; }
        .auth-corps { padding: 20px 32px 32px; display: flex; flex-direction: column; gap: 14px; }
        .auth-corps .input { background: #e9edf5; border-color: transparent; }
        .lien { background: none; border: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 13px; padding: 0; }
        .ligne-ref { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }

        @media (max-width: 900px) {
            .app { flex-direction: column; }
            .side { width: 100%; height: auto; position: static; }
            .main { padding: 16px; }
            .semaine { grid-template-columns: 1fr; }
            .halt, .axe { grid-template-columns: 1fr; gap: 4px; }
            .halt .chiffres { text-align: left; }
        }
        @media print {
            .side, .filtres, .actions, .btn { display: none !important; }
            .main { padding: 0; }
            .carte, .kpi { break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // --- IMPORTS FIREBASE ---
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, addDoc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const { useState, useMemo, useEffect, useRef } = React;

        // --- CONFIGURATION FIREBASE (même projet que l'ancien outil) ---
        const firebaseConfig = {
            apiKey: "AIzaSyC8lXHB5eg9j86C7wpEK7i9e05xM9zLyG8",
            authDomain: "pilotage-formation-nespresso.firebaseapp.com",
            projectId: "pilotage-formation-nespresso",
            storageBucket: "pilotage-formation-nespresso.firebasestorage.app",
            messagingSenderId: "368547547829",
            appId: "1:368547547829:web:0745d3b98da9750c5a4cfc"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Espace de données SÉPARÉ de l'ancien outil Nespresso ('pilotage-formation-b2c-b2b')
        const APP_ID = 'pilotage-grc-tersea';
        const refCol = (nom) => collection(db, 'artifacts', APP_ID, 'public', 'data', nom);
        const refDoc = (nom, id) => doc(db, 'artifacts', APP_ID, 'public', 'data', nom, id);

        // --- RÉFÉRENTIELS PAR DÉFAUT (modifiables dans l'écran Référentiels) ---
        const REF_DEFAUT = {
            activites: [
                { nom: 'Roole Bienvenue', canal: 'Sortant' },
                { nom: 'Roole Débordement', canal: 'Entrant' },
                { nom: 'Orange', canal: 'Entrant' }
            ],
            equipes: ['Équipe BV'],
            sites: ['Casablanca'],
            formateurs: ['Abdelaziz'],
            competences: ['Accueil', 'Écoute active', 'Empathie', 'Posture', 'Voix et communication', "Conduite d'échange", 'Argumentation', 'Traitement des objections', 'Adaptation au client'],
            typesFormation: ['Formation initiale', 'Formation continue', 'Atelier GRC', 'Micro-module GRC', 'Atelier de perfectionnement']
        };
        const CANAUX = ['Entrant', 'Sortant', 'Entrant & sortant'];
        const NIVEAUX = [
            { v: 1, lib: 'À acquérir' }, { v: 2, lib: "En cours d'acquisition" }, { v: 3, lib: 'Acquis' }, { v: 4, lib: 'Maîtrisé' }
        ];
        const QUARTILES = ['Q1', 'Q2', 'Q3', 'Q4'];
        const STATUTS_SESSION = ['Planifiée', 'Réalisée', 'Reportée', 'Annulée'];
        const STATUTS_ACC = ['Planifié', 'Réalisé', 'Annulé'];
        const TYPES_ACC = ['Coaching individuel', 'Écoute + débrief', 'Côte à côte', 'Suivi post-formation'];
        const ROLES = ['Admin', 'Lecture seule', 'En attente'];
        const TRANSVERSE = 'Transverse (toutes activités)';

        // --- UTILITAIRES ---
        const pad = (n) => String(n).padStart(2, '0');
        const isoLocal = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const aujourdhui = () => isoLocal(new Date());
        const fmtDate = (iso) => iso ? iso.split('-').reverse().join('/') : '';
        const libMois = (ym) => { const d = new Date(ym + '-01T00:00:00'); return isNaN(d) ? ym : d.toLocaleString('fr-FR', { month: 'long', year: 'numeric' }); };
        const pct = (n, d) => d > 0 ? Math.round(n / d * 100) : null;
        const aff = (v, suffixe = '') => v === null || v === undefined || v === '' || Number.isNaN(v) ? '—' : `${v}${suffixe}`;
        const moyenne = (t) => t.length ? t.reduce((a, b) => a + b, 0) / t.length : null;
        const arr1 = (v) => v === null ? null : Math.round(v * 10) / 10;
        const pl = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;
        const fr = (v) => v === null || v === undefined ? '—' : String(v).replace('.', ',');
        const trier = (t, cle) => [...t].sort((a, b) => String(a[cle] || '').localeCompare(String(b[cle] || ''), 'fr', { numeric: true }));
        const minutesDe = (hhmm) => { const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
        const lundiDe = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };

        const telecharger = (nomFichier, contenu, type) => {
            const blob = new Blob([contenu], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = nomFichier;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        // CSV au format Excel français (séparateur ; et encodage reconnu par Excel)
        const exporterCSV = (nom, entetes, lignes) => {
            const cellule = (v) => `"${String(v === null || v === undefined ? '' : v).replace(/"/g, '""')}"`;
            const texte = '﻿' + [entetes, ...lignes].map(l => l.map(cellule).join(';')).join('\r\n');
            telecharger(`${nom}_${aujourdhui()}.csv`, texte, 'text/csv;charset=utf-8;');
        };

        const Icone = ({ nom, taille = 18 }) => {
            const chemins = {
                accueil: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
                utilisateurs: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
                livre: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5',
                tendance: 'M23 6l-9.5 9.5-5-5L1 18M17 6h6v6',
                calendrier: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
                reglages: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
                cadenas: 'M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z',
                plus: 'M12 5v14M5 12h14',
                telecharger: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
                sortie: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
                alerte: 'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
                gauche: 'M15 18l-6-6 6-6', droite: 'M9 18l6-6-6-6'
            };
            return <svg width={taille} height={taille} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{ flexShrink: 0 }}><path d={chemins[nom] || ''} /></svg>;
        };

        const Champ = ({ libelle, children, classe = '' }) => <label className={`champ ${classe}`}><span>{libelle}</span>{children}</label>;
        const Choix = ({ valeur, onChange, options, vide, disabled }) => (
            <select className="input" value={valeur ?? ''} onChange={e => onChange(e.target.value)} disabled={disabled}>
                {vide !== undefined && <option value="">{vide}</option>}
                {options.map(o => typeof o === 'string' ? <option key={o} value={o}>{o}</option> : <option key={o.v} value={o.v}>{o.lib}</option>)}
            </select>
        );
        const Niveau = ({ v, bulle }) => <span className={`niv n${v || 0}`} data-bulle={bulle || (v ? `Niveau ${v} · ${NIVEAUX[v - 1].lib}` : 'Non évalué')}>{v || '–'}</span>;
        const BadgeStatut = ({ s }) => {
            const c = ['Réalisée', 'Réalisé'].includes(s) ? 'ok' : ['Annulée', 'Annulé'].includes(s) ? 'ko' : s === 'Reportée' ? 'alerte' : 'attente';
            return <span className={`badge ${c}`}>{s}</span>;
        };
        const Modal = ({ titre, children, onFermer }) => (
            <div className="modal-fond" onMouseDown={e => { if (e.target === e.currentTarget) onFermer(); }}>
                <div className="modal" role="dialog" aria-label={titre}><h2>{titre}</h2>{children}</div>
            </div>
        );

        // --- ACCÈS AUX DONNÉES : Firestore, avec repli local si la base refuse l'accès ---
        function useCollection(nom, surErreur) {
            const [items, setItems] = useState([]);
            const [pret, setPret] = useState(false);
            const local = useRef(false);
            const courant = useRef([]);
            const cle = 'tersea_' + nom;
            useEffect(() => {
                const unsub = onSnapshot(refCol(nom), (snap) => {
                    const data = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                    courant.current = data; setItems(data); setPret(true);
                }, (err) => {
                    local.current = true; surErreur && surErreur(err);
                    let data = []; try { data = JSON.parse(localStorage.getItem(cle) || '[]'); } catch (e) {}
                    courant.current = data; setItems(data); setPret(true);
                });
                return () => unsub();
            }, []);
            const majLocal = (suiv) => { courant.current = suiv; setItems(suiv); try { localStorage.setItem(cle, JSON.stringify(suiv)); } catch (e) {} };
            return {
                items, pret,
                ajouter: async (data) => {
                    if (local.current) { const id = 'L' + Date.now() + Math.random().toString(36).slice(2, 7); majLocal([...courant.current, { ...data, id }]); return id; }
                    const r = await addDoc(refCol(nom), data); return r.id;
                },
                modifier: async (id, data) => {
                    if (local.current) return majLocal(courant.current.map(x => x.id === id ? { ...x, ...data } : x));
                    await updateDoc(refDoc(nom, id), data);
                },
                supprimer: async (id) => {
                    if (local.current) return majLocal(courant.current.filter(x => x.id !== id));
                    await deleteDoc(refDoc(nom, id));
                },
                remplacerTout: async (liste) => {
                    for (const x of courant.current) { if (local.current) continue; await deleteDoc(refDoc(nom, x.id)); }
                    if (local.current) return majLocal(liste.map(x => ({ ...x, id: x.id || 'L' + Math.random().toString(36).slice(2, 10) })));
                    for (const x of liste) { const { id, ...reste } = x; if (id) await setDoc(refDoc(nom, id), reste); else await addDoc(refCol(nom), reste); }
                }
            };
        }

        function useReferentiels(surErreur) {
            const [ref, setRef] = useState(REF_DEFAUT);
            const local = useRef(false);
            useEffect(() => {
                const unsub = onSnapshot(refDoc('parametres', 'referentiels'), (snap) => {
                    setRef(snap.exists() ? { ...REF_DEFAUT, ...snap.data() } : REF_DEFAUT);
                }, (err) => {
                    local.current = true; surErreur && surErreur(err);
                    try { const l = JSON.parse(localStorage.getItem('tersea_referentiels') || 'null'); if (l) setRef({ ...REF_DEFAUT, ...l }); } catch (e) {}
                });
                return () => unsub();
            }, []);
            const enregistrer = async (suiv) => {
                if (local.current) { setRef(suiv); try { localStorage.setItem('tersea_referentiels', JSON.stringify(suiv)); } catch (e) {} return; }
                await setDoc(refDoc('parametres', 'referentiels'), suiv);
            };
            return [ref, enregistrer];
        }

        // --- AUTHENTIFICATION ---
        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null);
            const [adminLibre, setAdminLibre] = useState(false);
            const [modeLocal, setModeLocal] = useState(false);
            const [chargement, setChargement] = useState(true);

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, async (u) => {
                    if (!u) { setUser(null); setRole(null); setChargement(false); return; }
                    setUser(u);
                    try {
                        const r = await getDoc(refDoc('userRoles', u.uid));
                        let leRole = 'En attente';
                        if (r.exists()) leRole = r.data().role || 'En attente';
                        else await setDoc(refDoc('userRoles', u.uid), { email: u.email, role: 'En attente', dateCreation: Date.now() });
                        const a = await getDoc(refDoc('parametres', 'acces'));
                        setAdminLibre(!a.exists());
                        setRole(leRole);
                    } catch (e) {
                        console.error('Base inaccessible, passage en mode local :', e);
                        setModeLocal(true); setRole('Admin');
                    }
                    setChargement(false);
                });
                return () => unsub();
            }, []);

            const devenirAdmin = async () => {
                try {
                    await setDoc(refDoc('parametres', 'acces'), { adminUid: user.uid, email: user.email, date: Date.now() });
                    await setDoc(refDoc('userRoles', user.uid), { email: user.email, role: 'Admin' }, { merge: true });
                    setRole('Admin'); setAdminLibre(false);
                } catch (e) { alert("Impossible d'enregistrer : " + e.message); }
            };

            if (chargement) return <div className="auth"><p style={{ color: 'var(--encre-3)', fontWeight: 600 }}>Chargement…</p></div>;
            if (!user) return <EcranAuth />;
            if (role !== 'Admin' && role !== 'Lecture seule') {
                return (
                    <div className="auth"><div className="auth-carte">
                        <div className="auth-tete"><h2 style={{ marginTop: 0 }}>Accès en attente</h2><p>{user.email}</p></div>
                        <div className="auth-corps">
                            {adminLibre ? (
                                <>
                                    <p>Aucun administrateur n'est encore défini pour cet outil. Si tu en es le propriétaire, active ton accès administrateur. Cette étape n'est proposée qu'une seule fois.</p>
                                    <button className="btn primaire" onClick={devenirAdmin}>Devenir administrateur de l'outil</button>
                                </>
                            ) : <p>Ton compte est créé. L'administrateur de l'outil doit valider ton accès avant que tu puisses consulter les données.</p>}
                            <button className="btn" onClick={() => signOut(auth)}><Icone nom="sortie" /> Se déconnecter</button>
                        </div>
                    </div></div>
                );
            }
            return <Outil user={user} role={role} modeLocalInitial={modeLocal} />;
        }

        function EcranAuth() {
            const [inscription, setInscription] = useState(false);
            const [email, setEmail] = useState('');
            const [mdp, setMdp] = useState('');
            const [erreur, setErreur] = useState('');
            const [occupe, setOccupe] = useState(false);
            const soumettre = async (e) => {
                e.preventDefault(); setErreur(''); setOccupe(true);
                try {
                    if (inscription) await createUserWithEmailAndPassword(auth, email, mdp);
                    else await signInWithEmailAndPassword(auth, email, mdp);
                } catch (err) {
                    const messages = {
                        'auth/invalid-email': 'Adresse e-mail invalide.', 'auth/user-not-found': 'Aucun compte trouvé.',
                        'auth/wrong-password': 'Mot de passe incorrect.', 'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
                        'auth/email-already-in-use': 'Cet e-mail est déjà utilisé.', 'auth/weak-password': 'Le mot de passe doit faire au moins 6 caractères.'
                    };
                    setErreur(messages[err.code] || 'Erreur : ' + err.message);
                } finally { setOccupe(false); }
            };
            return (
                <div className="auth"><div className="auth-carte">
                    <div className="auth-tete">
                        <div className="marque-logo" style={{ width: 52, height: 52, fontSize: 20 }}><img src="logo.png" alt="Tersea" onError={e => { e.target.style.display = 'none'; e.target.parentNode.textContent = 'T'; }} /></div>
                        <div><span className="bienvenue">Pilotage GRC</span></div>
                        <h2>{inscription ? 'Je demande un accès' : 'Je me connecte'}</h2>
                        <p>Formation · Tersea</p>
                    </div>
                    <form className="auth-corps" onSubmit={soumettre}>
                        {erreur && <div className="bandeau erreur" style={{ margin: 0 }}><Icone nom="alerte" /> {erreur}</div>}
                        <Champ libelle="E-mail professionnel"><input className="input" type="email" required value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" /></Champ>
                        <Champ libelle="Mot de passe"><input className="input" type="password" required value={mdp} onChange={e => setMdp(e.target.value)} autoComplete={inscription ? 'new-password' : 'current-password'} /></Champ>
                        <button className="btn primaire" type="submit" disabled={occupe} style={{ justifyContent: 'center' }}>{inscription ? 'Créer mon compte' : 'Se connecter'}</button>
                        {inscription && <p style={{ fontSize: 12, color: 'var(--encre-3)' }}>Le compte reste sans accès tant que l'administrateur ne l'a pas validé.</p>}
                        <button type="button" className="lien" onClick={() => { setInscription(!inscription); setErreur(''); }}>{inscription ? "J'ai déjà un compte" : "Je n'ai pas de compte, demander un accès"}</button>
                    </form>
                </div></div>
            );
        }

        // --- OUTIL PRINCIPAL ---
        function Outil({ user, role, modeLocalInitial }) {
            const peutEditer = role === 'Admin';
            const [modeLocal, setModeLocal] = useState(modeLocalInitial);
            const surErreur = () => setModeLocal(true);
            const [ref, enregistrerRef] = useReferentiels(surErreur);
            const conseillersCol = useCollection('conseillers', surErreur);
            const sessionsCol = useCollection('sessions', surErreur);
            const accsCol = useCollection('accompagnements', surErreur);
            const [vue, setVue] = useState('accueil');
            const [filtres, setFiltres] = useState({ activite: '', canal: '', equipe: '', mois: '' });

            const conseillers = conseillersCol.items, sessions = sessionsCol.items, accs = accsCol.items;
            const parId = useMemo(() => Object.fromEntries(conseillers.map(c => [c.id, c])), [conseillers]);
            const canalDe = (activite) => (ref.activites.find(a => a.nom === activite) || {}).canal || '';
            const canalOk = (activite) => !filtres.canal || canalDe(activite) === filtres.canal || canalDe(activite) === 'Entrant & sortant';

            // Niveau actuel d'un conseiller sur une compétence : dernier niveau constaté en accompagnement, sinon le diagnostic
            const niveauActuel = useMemo(() => {
                const dernier = {};
                trier(accs.filter(a => a.statut === 'Réalisé' && a.niveauApres), 'date').forEach(a => { dernier[a.conseillerId + '|' + a.competence] = +a.niveauApres; });
                return (c, comp) => dernier[c.id + '|' + comp] || +(c.competences || {})[comp] || 0;
            }, [accs]);

            const passeC = (c) => c && (!filtres.activite || c.activite === filtres.activite) && canalOk(c.activite) && (!filtres.equipe || c.equipe === filtres.equipe);
            const fConseillers = useMemo(() => trier(conseillers.filter(passeC), 'nom'), [conseillers, filtres, ref]);
            const fSessions = useMemo(() => trier(sessions.filter(s => {
                if (filtres.activite && s.activite !== filtres.activite && s.activite !== TRANSVERSE) return false;
                if (filtres.canal && s.activite !== TRANSVERSE && !canalOk(s.activite)) return false;
                if (filtres.equipe && !(s.participants || []).some(id => parId[id] && parId[id].equipe === filtres.equipe)) return false;
                if (filtres.mois && (s.date || '').slice(0, 7) !== filtres.mois) return false;
                return true;
            }), 'date'), [sessions, filtres, parId, ref]);
            const fAccs = useMemo(() => trier(accs.filter(a => passeC(parId[a.conseillerId]) && (!filtres.mois || (a.date || '').slice(0, 7) === filtres.mois)), 'date'), [accs, filtres, parId, ref]);

            const moisDispo = useMemo(() => [...new Set([...sessions, ...accs].map(x => (x.date || '').slice(0, 7)).filter(Boolean))].sort().reverse(), [sessions, accs]);

            // Conflits : même formateur, même jour, horaires qui se chevauchent
            const conflits = useMemo(() => {
                const ids = new Set();
                const actives = sessions.filter(s => s.statut !== 'Annulée' && s.date && minutesDe(s.heure) !== null);
                actives.forEach((a, i) => actives.slice(i + 1).forEach(b => {
                    if (a.date !== b.date || (a.formateur || '') !== (b.formateur || '')) return;
                    const a0 = minutesDe(a.heure), a1 = a0 + (+a.dureeMin || 0), b0 = minutesDe(b.heure), b1 = b0 + (+b.dureeMin || 0);
                    if (a0 < b1 && b0 < a1) { ids.add(a.id); ids.add(b.id); }
                }));
                return ids;
            }, [sessions]);

            const ctx = { ref, enregistrerRef, peutEditer, conseillers, sessions, accs, parId, fConseillers, fSessions, fAccs, filtres, canalDe, niveauActuel, conflits, conseillersCol, sessionsCol, accsCol, setVue, user };

            const sauvegarde = () => telecharger(`Sauvegarde_Pilotage_GRC_${aujourdhui()}.json`, JSON.stringify({ version: 1, date: new Date().toISOString(), ref, conseillers, sessions, accompagnements: accs }, null, 2), 'application/json');
            const restaurer = (e) => {
                const f = e.target.files[0]; e.target.value = ''; if (!f) return;
                const lecteur = new FileReader();
                lecteur.onload = async () => {
                    try {
                        const d = JSON.parse(lecteur.result);
                        if (!Array.isArray(d.conseillers) || !Array.isArray(d.sessions) || !Array.isArray(d.accompagnements)) throw new Error('format');
                        if (!confirm(`Restaurer cette sauvegarde ? Les données actuelles seront remplacées par ${d.conseillers.length} conseillers, ${d.sessions.length} sessions et ${d.accompagnements.length} accompagnements.`)) return;
                        if (d.ref) await enregistrerRef({ ...REF_DEFAUT, ...d.ref });
                        await conseillersCol.remplacerTout(d.conseillers); await sessionsCol.remplacerTout(d.sessions); await accsCol.remplacerTout(d.accompagnements);
                        alert('Sauvegarde restaurée.');
                    } catch (err) { alert("Ce fichier n'est pas une sauvegarde valide de l'outil."); }
                };
                lecteur.readAsText(f);
            };

            const nbRetard = fSessions.filter(s => s.statut === 'Planifiée' && s.date && s.date < aujourdhui()).length + fAccs.filter(a => a.statut === 'Planifié' && a.date && a.date < aujourdhui()).length;
            const TITRES = {
                accueil: ['Tableau de bord', 'Indicateurs de suivi du poste Formateur GRC Transverse'],
                conseillers: ['Conseillers & compétences', 'Diagnostic, cartographie des compétences relationnelles et priorités'],
                formations: ['Formations & ateliers', 'Sessions planifiées et réalisées, participation, validation des acquis'],
                accompagnement: ['Accompagnement terrain', 'Une ligne par action : une compétence travaillée, un avant, un après'],
                planning: ['Planning', 'Sessions et accompagnements de la semaine, avec détection des conflits'],
                referentiels: ['Référentiels', 'Activités, équipes, compétences GRC et types de formation'],
                acces: ['Accès', "Qui peut consulter l'outil"]
            };
            const Nav = ({ id, icone, libelle, pastille }) => (
                <button className={`nav-btn ${vue === id ? 'actif' : ''}`} onClick={() => setVue(id)}><Icone nom={icone} /> {libelle}{pastille ? <span className="pastille">{pastille}</span> : null}</button>
            );

            return (
                <div className="app">
                    <aside className="side">
                        <div className="marque">
                            <div className="marque-logo"><img src="logo.png" alt="" onError={e => { e.target.style.display = 'none'; e.target.parentNode.textContent = 'T'; }} /></div>
                            <div><div className="marque-titre">Pilotage GRC</div><div className="marque-sous">Tersea · Formation</div></div>
                        </div>
                        <div className="nav-titre">Pilotage</div>
                        <Nav id="accueil" icone="accueil" libelle="Tableau de bord" pastille={nbRetard || null} />
                        <Nav id="planning" icone="calendrier" libelle="Planning" pastille={conflits.size || null} />
                        <div className="nav-titre">Suivi</div>
                        <Nav id="conseillers" icone="utilisateurs" libelle="Conseillers" />
                        <Nav id="formations" icone="livre" libelle="Formations" />
                        <Nav id="accompagnement" icone="tendance" libelle="Accompagnement" />
                        {peutEditer && <><div className="nav-titre">Administration</div>
                            <Nav id="referentiels" icone="reglages" libelle="Référentiels" />
                            {!modeLocal && <Nav id="acces" icone="cadenas" libelle="Accès" />}</>}
                        <div className="side-bas">
                            <div className="qui"><b>{modeLocal ? 'Mode local' : role}</b>{user.email}</div>
                            {peutEditer && <>
                                <button className="btn sombre" onClick={sauvegarde}><Icone nom="telecharger" taille={15} /> Sauvegarde complète</button>
                                <label className="btn sombre" style={{ cursor: 'pointer' }}>Restaurer une sauvegarde<input type="file" accept=".json" hidden onChange={restaurer} /></label>
                            </>}
                            <button className="btn sombre" onClick={() => signOut(auth)}><Icone nom="sortie" taille={15} /> Déconnexion</button>
                        </div>
                    </aside>
                    <main className="main">
                        {modeLocal && <div className="bandeau alerte"><Icone nom="alerte" /><div><b>Mode local.</b> La base en ligne refuse l'accès à l'espace Tersea : les données sont enregistrées uniquement dans ce navigateur et ne sont pas partagées. Les règles de sécurité Firebase doivent autoriser l'espace « {APP_ID} ».</div></div>}
                        {!peutEditer && <div className="bandeau info"><Icone nom="cadenas" /><div>Tu consultes l'outil en lecture seule.</div></div>}
                        <div className="entete"><div><h1>{TITRES[vue][0]}</h1><p>{TITRES[vue][1]}</p></div></div>
                        {!['referentiels', 'acces'].includes(vue) && (
                            <div className="filtres">
                                <Champ libelle="Activité"><Choix valeur={filtres.activite} onChange={v => setFiltres({ ...filtres, activite: v })} options={ref.activites.map(a => a.nom)} vide="Toutes" /></Champ>
                                <Champ libelle="Canal"><Choix valeur={filtres.canal} onChange={v => setFiltres({ ...filtres, canal: v })} options={['Entrant', 'Sortant']} vide="Tous" /></Champ>
                                <Champ libelle="Équipe"><Choix valeur={filtres.equipe} onChange={v => setFiltres({ ...filtres, equipe: v })} options={ref.equipes} vide="Toutes" /></Champ>
                                {vue !== 'planning' && <Champ libelle="Période"><Choix valeur={filtres.mois} onChange={v => setFiltres({ ...filtres, mois: v })} options={moisDispo.map(m => ({ v: m, lib: libMois(m) }))} vide="Toute la période" /></Champ>}
                                {(filtres.activite || filtres.canal || filtres.equipe || filtres.mois) && <button className="btn" onClick={() => setFiltres({ activite: '', canal: '', equipe: '', mois: '' })}>Réinitialiser</button>}
                            </div>
                        )}
                        {vue === 'accueil' && <TableauBord ctx={ctx} />}
                        {vue === 'conseillers' && <VueConseillers ctx={ctx} />}
                        {vue === 'formations' && <VueFormations ctx={ctx} />}
                        {vue === 'accompagnement' && <VueAccompagnement ctx={ctx} />}
                        {vue === 'planning' && <VuePlanning ctx={ctx} />}
                        {vue === 'referentiels' && peutEditer && <VueReferentiels ctx={ctx} />}
                        {vue === 'acces' && peutEditer && !modeLocal && <VueAcces ctx={ctx} />}
                    </main>
                </div>
            );
        }

        // --- CALCULS PARTAGÉS ---
        const compteSession = (s) => {
            const p = s.participants || [];
            if (p.length > 0) return { prevus: p.length, presents: (s.presents || []).filter(id => p.includes(id)).length, valides: (s.valides || []).filter(id => p.includes(id)).length };
            return { prevus: +s.nbPrevus || 0, presents: +s.nbPresents || 0, valides: +s.nbValides || 0 };
        };
        const calculerIndicateurs = (sessions, accs, conseillers, niveauActuel, competences) => {
            const auj = aujourdhui();
            // À date = sessions passées, plus celles déjà réalisées aujourd'hui (une session prévue plus tard dans la journée n'est pas en retard)
            const echues = sessions.filter(s => s.date && (s.date < auj || (s.date === auj && s.statut === 'Réalisée')));
            const realisees = sessions.filter(s => s.statut === 'Réalisée');
            const tot = realisees.map(compteSession).reduce((a, c) => ({ prevus: a.prevus + c.prevus, presents: a.presents + c.presents, valides: a.valides + c.valides }), { prevus: 0, presents: 0, valides: 0 });
            const accEchus = accs.filter(a => a.date && (a.date < auj || (a.date === auj && a.statut === 'Réalisé')));
            const accRealises = accs.filter(a => a.statut === 'Réalisé');
            // Progression : par conseiller et par compétence, premier niveau "avant" contre dernier niveau "après"
            const paires = {};
            trier(accRealises.filter(a => a.niveauAvant && a.niveauApres), 'date').forEach(a => {
                const k = a.conseillerId + '|' + a.competence;
                if (!paires[k]) paires[k] = { conseillerId: a.conseillerId, avant: +a.niveauAvant, apres: +a.niveauApres };
                else paires[k].apres = +a.niveauApres;
            });
            const lp = Object.values(paires);
            const suivis = new Set(lp.map(p => p.conseillerId));
            const enProgres = new Set(lp.filter(p => p.apres > p.avant).map(p => p.conseillerId));
            const actifs = conseillers.filter(c => c.statut !== 'Sorti');
            const parComp = competences.map(comp => {
                const evalues = actifs.filter(c => +(c.competences || {})[comp] > 0);
                return { comp, n: evalues.length, avant: arr1(moyenne(evalues.map(c => +c.competences[comp]))), apres: arr1(moyenne(evalues.map(c => niveauActuel(c, comp)))) };
            });
            const nums = (cle) => actifs.map(c => parseFloat(String(c[cle] ?? '').replace(',', '.'))).filter(v => !Number.isNaN(v));
            return {
                sessReal: echues.filter(s => s.statut === 'Réalisée').length, sessEchues: echues.length, sessAVenir: sessions.filter(s => s.date >= auj && s.statut === 'Planifiée').length,
                ...tot, accReal: accEchus.filter(a => a.statut === 'Réalisé').length, accEchus: accEchus.length, accTotalReal: accRealises.length,
                suivis: suivis.size, enProgres: enProgres.size, gain: arr1(moyenne(lp.map(p => p.apres - p.avant))),
                parComp, satcli: arr1(moyenne(nums('satcli'))), qualite: arr1(moyenne(nums('qualite'))), nbActifs: actifs.length
            };
        };

        // --- TABLEAU DE BORD ---
        function TableauBord({ ctx }) {
            const { ref, fSessions, fAccs, fConseillers, niveauActuel, parId, setVue, conflits } = ctx;
            const k = useMemo(() => calculerIndicateurs(fSessions, fAccs, fConseillers, niveauActuel, ref.competences), [fSessions, fAccs, fConseillers, niveauActuel, ref]);
            const auj = aujourdhui();
            const parActivite = ref.activites.map(a => {
                const cs = fConseillers.filter(c => c.activite === a.nom);
                const ids = new Set(cs.map(c => c.id));
                const i = calculerIndicateurs(fSessions.filter(s => s.activite === a.nom), fAccs.filter(x => ids.has(x.conseillerId)), cs, niveauActuel, ref.competences);
                return { ...a, i };
            });
            const aTraiter = [
                ...fSessions.filter(s => s.statut === 'Planifiée' && s.date && s.date < auj).map(s => ({ date: s.date, texte: `Session « ${s.titre} » toujours « Planifiée »`, vue: 'formations' })),
                ...fAccs.filter(a => a.statut === 'Planifié' && a.date && a.date < auj).map(a => ({ date: a.date, texte: `Accompagnement de ${(parId[a.conseillerId] || {}).nom || '?'} (${a.competence}) non clôturé`, vue: 'accompagnement' })),
                ...fAccs.filter(a => a.statut === 'Réalisé' && a.echeance && a.echeance <= auj && !fAccs.some(b => b.conseillerId === a.conseillerId && b.competence === a.competence && b.date > a.date)).map(a => ({ date: a.echeance, texte: `Point de suivi à faire : ${(parId[a.conseillerId] || {}).nom || '?'} (${a.competence})`, vue: 'accompagnement' }))
            ].sort((a, b) => a.date.localeCompare(b.date));

            const Tuile = ({ lib, n, d, det }) => {
                const p = pct(n, d);
                return <div className="kpi"><div className="lib">{lib}</div><div className="val">{p === null ? '—' : p}{p !== null && <small>%</small>}</div><div className="det">{det}</div><div className="jauge"><div style={{ width: `${Math.min(p || 0, 100)}%` }}></div></div></div>;
            };
            const exporter = () => exporterCSV('Reporting_GRC', ['Indicateur', 'Valeur', 'Détail'], [
                ['Taux de réalisation des formations planifiées', aff(pct(k.sessReal, k.sessEchues), ' %'), `${k.sessReal} réalisées sur ${k.sessEchues} à date`],
                ['Taux de participation', aff(pct(k.presents, k.prevus), ' %'), `${k.presents} présents sur ${k.prevus} inscrits`],
                ['Taux de validation des acquis', aff(pct(k.valides, k.presents), ' %'), `${k.valides} validés sur ${k.presents} présents`],
                ['Taux de réalisation des actions de coaching', aff(pct(k.accReal, k.accEchus), ' %'), `${k.accReal} réalisées sur ${k.accEchus} à date`],
                ['Conseillers en progression après accompagnement', aff(pct(k.enProgres, k.suivis), ' %'), `${k.enProgres} sur ${k.suivis} conseillers mesurés`],
                ['Gain moyen de niveau après accompagnement', fr(k.gain), 'échelle 1 à 4'],
                ['SATCLI moyenne', fr(k.satcli), `${k.nbActifs} conseillers actifs`],
                ['Note qualité moyenne', fr(k.qualite), ''],
                [], ['Compétence', 'Niveau moyen au diagnostic', 'Niveau moyen actuel', 'Conseillers évalués'],
                ...k.parComp.map(c => [c.comp, fr(c.avant), fr(c.apres), c.n]),
                [], ['Activité', 'Canal', 'Conseillers actifs', 'Sessions réalisées', 'Participation', 'Coachings réalisés', 'Conseillers en progression'],
                ...parActivite.map(a => [a.nom, a.canal, a.i.nbActifs, a.i.sessReal, aff(pct(a.i.presents, a.i.prevus), ' %'), a.i.accTotalReal, `${a.i.enProgres} / ${a.i.suivis}`])
            ]);
            const pos = (v) => `${((v - 1) / 3) * 100}%`;

            return (
                <>
                    <div className="actions" style={{ marginBottom: 14 }}>
                        <button className="btn" onClick={exporter}><Icone nom="telecharger" taille={15} /> Exporter le reporting (Excel)</button>
                        <button className="btn" onClick={() => window.print()}>Imprimer / PDF</button>
                    </div>
                    <div className="kpis">
                        <Tuile lib="Réalisation des formations planifiées" n={k.sessReal} d={k.sessEchues} det={`${pl(k.sessReal, 'réalisée')} sur ${k.sessEchues} à date · ${k.sessAVenir} à venir`} />
                        <Tuile lib="Participation aux formations" n={k.presents} d={k.prevus} det={`${pl(k.presents, 'présent')} sur ${pl(k.prevus, 'inscrit')}`} />
                        <Tuile lib="Validation des acquis" n={k.valides} d={k.presents} det={`${pl(k.valides, 'validé')} sur ${pl(k.presents, 'présent')}`} />
                        <Tuile lib="Réalisation des actions de coaching" n={k.accReal} d={k.accEchus} det={`${pl(k.accReal, 'réalisée')} sur ${k.accEchus} à date`} />
                        <Tuile lib="Conseillers en progression après accompagnement" n={k.enProgres} d={k.suivis} det={`${k.enProgres} sur ${pl(k.suivis, 'mesuré')} · gain moyen ${k.gain === null ? '—' : (k.gain > 0 ? '+' : '') + fr(k.gain)} niveau`} />
                        <div className="kpi"><div className="lib">SATCLI et qualité (valeurs actuelles)</div><div className="val">{fr(k.satcli)}</div><div className="det">SATCLI moyenne · qualité {fr(k.qualite)} · {pl(k.nbActifs, 'conseiller')} {k.nbActifs > 1 ? 'actifs' : 'actif'}</div></div>
                    </div>

                    <div className="carte">
                        <h2>Évolution des compétences identifiées au diagnostic</h2>
                        <p className="sous">Niveau moyen des conseillers évalués, de 1 (à acquérir) à 4 (maîtrisé). Le niveau actuel reprend le dernier niveau constaté en accompagnement.</p>
                        {k.parComp.some(c => c.n > 0) ? <>
                            <div className="legende"><span><i className="puce" style={{ background: 'var(--serie-avant)' }}></i> Diagnostic</span><span><i className="puce" style={{ background: 'var(--serie-apres)' }}></i> Niveau actuel</span></div>
                            {k.parComp.filter(c => c.n > 0).map(c => (
                                <div className="halt" key={c.comp}>
                                    <div className="nom">{c.comp}</div>
                                    <div className="piste">
                                        <div className="lien" style={{ left: pos(Math.min(c.avant, c.apres)), width: `${(Math.abs(c.apres - c.avant) / 3) * 100}%` }}></div>
                                        <div className="pt avant" style={{ left: pos(c.avant) }} data-bulle={`Diagnostic : ${fr(c.avant)}`}></div>
                                        <div className="pt apres" style={{ left: pos(c.apres) }} data-bulle={`Actuel : ${fr(c.apres)} (${c.n} conseillers)`}></div>
                                    </div>
                                    <div className="chiffres">{fr(c.avant)} → <b>{fr(c.apres)}</b></div>
                                </div>
                            ))}
                            <div className="axe"><span></span><div className="grad"><span>1</span><span>2</span><span>3</span><span>4</span></div><span></span></div>
                        </> : <div className="vide">Aucun diagnostic saisi. Renseigne les niveaux de compétences dans la fiche des conseillers.</div>}
                    </div>

                    <div className="carte">
                        <h2>Par activité</h2><p className="sous">Selon les filtres en cours.</p>
                        <div className="tab-wrap"><table className="tab">
                            <thead><tr><th>Activité</th><th>Canal</th><th className="num">Conseillers actifs</th><th className="num">Sessions réalisées</th><th className="num">Participation</th><th className="num">Coachings réalisés</th><th className="num">En progression</th></tr></thead>
                            <tbody>{parActivite.map(a => <tr key={a.nom}><td><b>{a.nom}</b></td><td>{a.canal}</td><td className="num">{a.i.nbActifs}</td><td className="num">{a.i.sessReal}</td><td className="num">{aff(pct(a.i.presents, a.i.prevus), ' %')}</td><td className="num">{a.i.accTotalReal}</td><td className="num">{a.i.enProgres} / {a.i.suivis}</td></tr>)}</tbody>
                        </table></div>
                    </div>

                    <div className="carte">
                        <h2>À traiter</h2><p className="sous">Éléments en retard ou à relancer.</p>
                        {conflits.size > 0 && <div className="bandeau erreur"><Icone nom="alerte" /><div>{conflits.size} sessions se chevauchent pour un même formateur. <button className="lien" onClick={() => setVue('planning')}>Voir le planning</button></div></div>}
                        {aTraiter.length === 0 ? <div className="vide">Rien en retard.</div> : (
                            <table className="tab"><tbody>{aTraiter.slice(0, 15).map((x, i) => <tr key={i}><td style={{ width: 100 }}>{fmtDate(x.date)}</td><td>{x.texte}</td><td className="num"><button className="btn mini" onClick={() => setVue(x.vue)}>Ouvrir</button></td></tr>)}</tbody></table>
                        )}
                        {aTraiter.length > 15 && <p className="sous" style={{ marginTop: 8 }}>… et {aTraiter.length - 15} autres.</p>}
                    </div>
                </>
            );
        }

        // --- CONSEILLERS ---
        function VueConseillers({ ctx }) {
            const { ref, peutEditer, fConseillers, conseillers, conseillersCol, niveauActuel, accs, canalDe } = ctx;
            const [mode, setMode] = useState('liste');
            const [edition, setEdition] = useState(null);
            const [importe, setImporte] = useState(null);
            const [recherche, setRecherche] = useState('');
            const [sortis, setSortis] = useState(false);
            const liste = fConseillers.filter(c => (sortis || c.statut !== 'Sorti') && (c.nom || '').toLowerCase().includes(recherche.toLowerCase()));
            const vide = { nom: '', activite: ref.activites[0]?.nom || '', equipe: ref.equipes[0] || '', site: ref.sites[0] || '', statut: 'Actif', quartile: '', satcli: '', qualite: '', competences: {}, commentaire: '' };
            const nbAcc = (c) => accs.filter(a => a.conseillerId === c.id && a.statut === 'Réalisé').length;
            // Priorité d'accompagnement : compétences les plus faibles (niveau 1 ou 2)
            const faibles = (c) => ref.competences.filter(comp => { const n = niveauActuel(c, comp); return n > 0 && n <= 2; });

            const enregistrer = async () => {
                const d = { ...edition, nom: (edition.nom || '').trim() };
                if (!d.nom) return alert('Le nom est obligatoire.');
                if (conseillers.some(c => c.id !== d.id && (c.nom || '').trim().toLowerCase() === d.nom.toLowerCase() && c.activite === d.activite)) return alert('Ce conseiller existe déjà sur cette activité.');
                const { id, ...data } = d;
                try { if (id) await conseillersCol.modifier(id, data); else await conseillersCol.ajouter(data); setEdition(null); } catch (e) { alert('Enregistrement impossible : ' + e.message); }
            };
            const supprimer = async () => {
                if (accs.some(a => a.conseillerId === edition.id)) return alert('Ce conseiller a des accompagnements enregistrés. Passe-le plutôt au statut « Sorti » pour conserver son historique.');
                if (!confirm(`Supprimer ${edition.nom} ?`)) return;
                await conseillersCol.supprimer(edition.id); setEdition(null);
            };
            const lancerImport = async () => {
                const lignes = importe.texte.split(/\r?\n/).map(l => l.split(/\t|;/).map(x => x.trim())).filter(l => l[0]);
                let ajoutes = 0, ignores = 0;
                const vus = new Set(conseillers.map(c => (c.nom || '').toLowerCase() + '|' + c.activite));
                for (const l of lignes) {
                    if (l[0].toLowerCase() === 'nom') continue;
                    const activite = ref.activites.find(a => a.nom.toLowerCase() === (l[1] || '').toLowerCase())?.nom || importe.activite;
                    const cle = l[0].toLowerCase() + '|' + activite;
                    if (vus.has(cle)) { ignores++; continue; }
                    vus.add(cle);
                    await conseillersCol.ajouter({ ...vide, nom: l[0], activite, equipe: l[2] || importe.equipe, site: l[3] || vide.site });
                    ajoutes++;
                }
                alert(`${pl(ajoutes, 'conseiller')} ${ajoutes > 1 ? 'ajoutés' : 'ajouté'}${ignores ? `, ${ignores} déjà ${ignores > 1 ? 'présents ignorés' : 'présent ignoré'}` : ''}.`);
                setImporte(null);
            };
            const exporter = () => exporterCSV('Conseillers_GRC', ['Nom', 'Activité', 'Canal', 'Équipe', 'Site', 'Statut', 'Quartile', 'SATCLI', 'Qualité', ...ref.competences.flatMap(c => [`${c} (diagnostic)`, `${c} (actuel)`]), 'Accompagnements réalisés', 'Commentaire'],
                liste.map(c => [c.nom, c.activite, canalDe(c.activite), c.equipe, c.site, c.statut, c.quartile, c.satcli, c.qualite, ...ref.competences.flatMap(comp => [(c.competences || {})[comp] || '', niveauActuel(c, comp) || '']), nbAcc(c), c.commentaire]));

            return (
                <>
                    <div className="actions" style={{ marginBottom: 14 }}>
                        <button className={`btn ${mode === 'liste' ? 'primaire' : ''}`} onClick={() => setMode('liste')}>Liste</button>
                        <button className={`btn ${mode === 'carto' ? 'primaire' : ''}`} onClick={() => setMode('carto')}>Cartographie des compétences</button>
                        <input className="input" style={{ width: 200 }} placeholder="Rechercher un nom…" value={recherche} onChange={e => setRecherche(e.target.value)} />
                        <label className="coche"><input type="checkbox" checked={sortis} onChange={e => setSortis(e.target.checked)} /> Afficher les sortis</label>
                        <span style={{ flex: 1 }}></span>
                        <button className="btn" onClick={exporter}><Icone nom="telecharger" taille={15} /> Exporter</button>
                        {peutEditer && <button className="btn" onClick={() => setImporte({ texte: '', activite: vide.activite, equipe: vide.equipe })}>Importer une liste</button>}
                        {peutEditer && <button className="btn primaire" onClick={() => setEdition(vide)}><Icone nom="plus" taille={15} /> Conseiller</button>}
                    </div>

                    {mode === 'liste' && <div className="carte"><div className="tab-wrap"><table className="tab">
                        <thead><tr><th>Conseiller</th><th>Activité</th><th>Équipe</th><th className="centre">Quartile</th><th className="num">SATCLI</th><th className="num">Qualité</th><th>Compétences à travailler en priorité</th><th className="num">Accomp.</th><th></th></tr></thead>
                        <tbody>
                            {liste.map(c => <tr key={c.id}>
                                <td><b>{c.nom}</b>{c.statut === 'Sorti' && <span className="badge" style={{ marginLeft: 8 }}>Sorti</span>}</td>
                                <td>{c.activite}</td><td>{c.equipe}</td><td className="centre">{c.quartile || '—'}</td><td className="num">{aff(c.satcli)}</td><td className="num">{aff(c.qualite)}</td>
                                <td>{faibles(c).length ? faibles(c).slice(0, 3).join(', ') + (faibles(c).length > 3 ? ` +${faibles(c).length - 3}` : '') : <span style={{ color: 'var(--encre-3)' }}>{Object.keys(c.competences || {}).length ? 'Aucune' : 'Diagnostic à faire'}</span>}</td>
                                <td className="num">{nbAcc(c)}</td>
                                <td className="num"><button className="btn mini" onClick={() => setEdition({ ...vide, ...c })}>{peutEditer ? 'Modifier' : 'Voir'}</button></td>
                            </tr>)}
                            {liste.length === 0 && <tr><td colSpan="9" className="vide">Aucun conseiller. {peutEditer && 'Ajoute-les un par un ou colle une liste depuis Excel avec « Importer une liste ».'}</td></tr>}
                        </tbody>
                    </table></div></div>}

                    {mode === 'carto' && <div className="carte">
                        <div className="legende">{NIVEAUX.map(n => <span key={n.v}><Niveau v={n.v} /> {n.lib}</span>)}<span><Niveau v={0} /> Non évalué</span><span>▲ a progressé depuis le diagnostic</span></div>
                        <div className="tab-wrap"><table className="tab">
                            <thead><tr><th>Conseiller</th><th className="centre">Quartile</th>{ref.competences.map(c => <th key={c} className="centre" style={{ whiteSpace: 'normal', minWidth: 78 }}>{c}</th>)}</tr></thead>
                            <tbody>
                                {liste.map(c => <tr key={c.id}><td><b>{c.nom}</b><div style={{ fontSize: 11, color: 'var(--encre-3)' }}>{c.activite}</div></td><td className="centre">{c.quartile || '—'}</td>
                                    {ref.competences.map(comp => { const d = +(c.competences || {})[comp] || 0, a = niveauActuel(c, comp); return <td key={comp} className="centre"><Niveau v={a} bulle={a ? `${c.nom} · ${comp} : ${NIVEAUX[a - 1].lib}${d && a !== d ? ` (diagnostic : ${d})` : ''}` : undefined} />{d > 0 && a > d ? <span style={{ fontSize: 10, marginLeft: 2 }}>▲</span> : null}</td>; })}
                                </tr>)}
                                {liste.length > 0 && <tr><td colSpan="2"><b>Niveau moyen</b></td>{ref.competences.map(comp => { const v = liste.map(c => niveauActuel(c, comp)).filter(Boolean); return <td key={comp} className="centre"><b>{fr(arr1(moyenne(v)))}</b></td>; })}</tr>}
                                {liste.length === 0 && <tr><td colSpan={ref.competences.length + 2} className="vide">Aucun conseiller à afficher.</td></tr>}
                            </tbody>
                        </table></div>
                    </div>}

                    {edition && <Modal titre={edition.id ? edition.nom : 'Nouveau conseiller'} onFermer={() => setEdition(null)}>
                        <fieldset disabled={!peutEditer} style={{ border: 0, padding: 0, margin: 0 }}>
                            <div className="grille">
                                <Champ libelle="Nom et prénom" classe="pleine"><input className="input" value={edition.nom} onChange={e => setEdition({ ...edition, nom: e.target.value })} autoFocus /></Champ>
                                <Champ libelle="Activité"><Choix valeur={edition.activite} onChange={v => setEdition({ ...edition, activite: v })} options={ref.activites.map(a => a.nom)} /></Champ>
                                <Champ libelle="Équipe"><Choix valeur={edition.equipe} onChange={v => setEdition({ ...edition, equipe: v })} options={ref.equipes} vide="—" /></Champ>
                                <Champ libelle="Site"><Choix valeur={edition.site} onChange={v => setEdition({ ...edition, site: v })} options={ref.sites} vide="—" /></Champ>
                                <Champ libelle="Statut"><Choix valeur={edition.statut} onChange={v => setEdition({ ...edition, statut: v })} options={['Actif', 'Sorti']} /></Champ>
                            </div>
                            <div className="sec">Diagnostic</div>
                            <div className="grille">
                                <Champ libelle="Quartile"><Choix valeur={edition.quartile} onChange={v => setEdition({ ...edition, quartile: v })} options={QUARTILES} vide="—" /></Champ>
                                <Champ libelle="SATCLI"><input className="input" inputMode="decimal" value={edition.satcli} onChange={e => setEdition({ ...edition, satcli: e.target.value })} /></Champ>
                                <Champ libelle="Note qualité"><input className="input" inputMode="decimal" value={edition.qualite} onChange={e => setEdition({ ...edition, qualite: e.target.value })} /></Champ>
                            </div>
                            <div className="sec">Niveau par compétence au diagnostic</div>
                            <div className="grille">
                                {ref.competences.map(comp => <Champ key={comp} libelle={comp}><Choix valeur={(edition.competences || {})[comp] || ''} onChange={v => setEdition({ ...edition, competences: { ...(edition.competences || {}), [comp]: v ? +v : 0 } })} options={NIVEAUX.map(n => ({ v: n.v, lib: `${n.v} · ${n.lib}` }))} vide="Non évalué" /></Champ>)}
                            </div>
                            <Champ libelle="Commentaire"><textarea className="input" value={edition.commentaire || ''} onChange={e => setEdition({ ...edition, commentaire: e.target.value })}></textarea></Champ>
                        </fieldset>
                        <div className="modal-pied">
                            <div>{peutEditer && edition.id && <button className="btn danger" onClick={supprimer}>Supprimer</button>}</div>
                            <div className="actions"><button className="btn" onClick={() => setEdition(null)}>Fermer</button>{peutEditer && <button className="btn primaire" onClick={enregistrer}>Enregistrer</button>}</div>
                        </div>
                    </Modal>}

                    {importe && <Modal titre="Importer une liste de conseillers" onFermer={() => setImporte(null)}>
                        <p style={{ marginBottom: 10, color: 'var(--encre-2)' }}>Colle les lignes copiées depuis Excel : une ligne par conseiller, colonnes dans l'ordre <b>Nom, Activité, Équipe, Site</b>. Seul le nom est obligatoire ; les valeurs ci-dessous servent quand une colonne est vide. Les conseillers déjà présents sont ignorés.</p>
                        <div className="grille">
                            <Champ libelle="Activité par défaut"><Choix valeur={importe.activite} onChange={v => setImporte({ ...importe, activite: v })} options={ref.activites.map(a => a.nom)} /></Champ>
                            <Champ libelle="Équipe par défaut"><Choix valeur={importe.equipe} onChange={v => setImporte({ ...importe, equipe: v })} options={ref.equipes} vide="—" /></Champ>
                        </div>
                        <textarea className="input" style={{ minHeight: 180 }} value={importe.texte} onChange={e => setImporte({ ...importe, texte: e.target.value })} placeholder={'Nom Prénom\tRoole Bienvenue\tÉquipe BV'}></textarea>
                        <div className="modal-pied"><span></span><div className="actions"><button className="btn" onClick={() => setImporte(null)}>Annuler</button><button className="btn primaire" onClick={lancerImport} disabled={!importe.texte.trim()}>Importer</button></div></div>
                    </Modal>}
                </>
            );
        }

        // --- FORMATIONS ---
        function VueFormations({ ctx }) {
            const { ref, peutEditer, fSessions, sessionsCol, conseillers, conflits, parId } = ctx;
            const [edition, setEdition] = useState(null);
            const vide = { titre: '', type: ref.typesFormation[0] || '', activite: ref.activites[0]?.nom || TRANSVERSE, date: aujourdhui(), heure: '09:00', dureeMin: 45, formateur: ref.formateurs[0] || '', statut: 'Planifiée', participants: [], presents: [], valides: [], nbPrevus: '', nbPresents: '', nbValides: '', commentaire: '' };
            const eligibles = edition ? trier(conseillers.filter(c => (c.statut !== 'Sorti' || (edition.participants || []).includes(c.id)) && (edition.activite === TRANSVERSE || c.activite === edition.activite || (edition.participants || []).includes(c.id))), 'nom') : [];
            const basculer = (cle, id) => {
                const a = new Set(edition[cle] || []);
                a.has(id) ? a.delete(id) : a.add(id);
                const suiv = { ...edition, [cle]: [...a] };
                if (cle === 'participants' && !a.has(id)) { suiv.presents = (edition.presents || []).filter(x => x !== id); suiv.valides = (edition.valides || []).filter(x => x !== id); }
                if (cle === 'presents' && a.has(id) && !(edition.participants || []).includes(id)) suiv.participants = [...(edition.participants || []), id];
                if (cle === 'presents' && !a.has(id)) suiv.valides = (edition.valides || []).filter(x => x !== id);
                if (cle === 'valides' && a.has(id)) { suiv.participants = [...new Set([...(edition.participants || []), id])]; suiv.presents = [...new Set([...(edition.presents || []), id])]; }
                setEdition(suiv);
            };
            const enregistrer = async () => {
                const d = { ...edition, titre: (edition.titre || '').trim(), dureeMin: +edition.dureeMin || 0 };
                if (!d.titre) return alert('Le titre est obligatoire.');
                if (!d.date) return alert('La date est obligatoire.');
                const { id, ...data } = d;
                try { if (id) await sessionsCol.modifier(id, data); else await sessionsCol.ajouter(data); setEdition(null); } catch (e) { alert('Enregistrement impossible : ' + e.message); }
            };
            const exporter = () => exporterCSV('Formations_GRC', ['Date', 'Heure', 'Durée (min)', 'Titre', 'Type', 'Activité', 'Formateur', 'Statut', 'Inscrits', 'Présents', 'Acquis validés', 'Participation', 'Validation', 'Participants', 'Commentaire'],
                fSessions.map(s => { const c = compteSession(s); return [fmtDate(s.date), s.heure, s.dureeMin, s.titre, s.type, s.activite, s.formateur, s.statut, c.prevus, c.presents, c.valides, aff(pct(c.presents, c.prevus), ' %'), aff(pct(c.valides, c.presents), ' %'), (s.participants || []).map(id => (parId[id] || {}).nom).filter(Boolean).join(', '), s.commentaire]; }));
            const nominatif = edition && (edition.participants || []).length > 0;

            return (
                <>
                    <div className="actions" style={{ marginBottom: 14 }}>
                        <span style={{ flex: 1 }}></span>
                        <button className="btn" onClick={exporter}><Icone nom="telecharger" taille={15} /> Exporter</button>
                        {peutEditer && <button className="btn primaire" onClick={() => setEdition(vide)}><Icone nom="plus" taille={15} /> Session</button>}
                    </div>
                    <div className="carte"><div className="tab-wrap"><table className="tab">
                        <thead><tr><th>Date</th><th>Session</th><th>Type</th><th>Activité</th><th>Statut</th><th className="num">Inscrits</th><th className="num">Présents</th><th className="num">Validés</th><th></th></tr></thead>
                        <tbody>
                            {[...fSessions].reverse().map(s => { const c = compteSession(s); return <tr key={s.id}>
                                <td style={{ whiteSpace: 'nowrap' }}>{fmtDate(s.date)}<div style={{ fontSize: 11, color: 'var(--encre-3)' }}>{s.heure} · {s.dureeMin} min</div></td>
                                <td><b>{s.titre}</b>{conflits.has(s.id) && <span className="badge ko" style={{ marginLeft: 8 }}><Icone nom="alerte" taille={12} /> Conflit d'horaire</span>}<div style={{ fontSize: 11, color: 'var(--encre-3)' }}>{s.formateur}</div></td>
                                <td>{s.type}</td><td>{s.activite}</td><td><BadgeStatut s={s.statut} /></td>
                                <td className="num">{c.prevus}</td><td className="num">{s.statut === 'Réalisée' ? `${c.presents} (${aff(pct(c.presents, c.prevus), ' %')})` : '—'}</td><td className="num">{s.statut === 'Réalisée' ? `${c.valides} (${aff(pct(c.valides, c.presents), ' %')})` : '—'}</td>
                                <td className="num"><button className="btn mini" onClick={() => setEdition({ ...vide, ...s })}>{peutEditer ? 'Modifier' : 'Voir'}</button></td>
                            </tr>; })}
                            {fSessions.length === 0 && <tr><td colSpan="9" className="vide">Aucune session sur ces filtres.</td></tr>}
                        </tbody>
                    </table></div></div>

                    {edition && <Modal titre={edition.id ? 'Session de formation' : 'Nouvelle session'} onFermer={() => setEdition(null)}>
                        <fieldset disabled={!peutEditer} style={{ border: 0, padding: 0, margin: 0 }}>
                            <div className="grille">
                                <Champ libelle="Titre" classe="pleine"><input className="input" value={edition.titre} onChange={e => setEdition({ ...edition, titre: e.target.value })} autoFocus /></Champ>
                                <Champ libelle="Type"><Choix valeur={edition.type} onChange={v => setEdition({ ...edition, type: v })} options={ref.typesFormation} /></Champ>
                                <Champ libelle="Activité"><Choix valeur={edition.activite} onChange={v => setEdition({ ...edition, activite: v })} options={[...ref.activites.map(a => a.nom), TRANSVERSE]} /></Champ>
                                <Champ libelle="Formateur"><Choix valeur={edition.formateur} onChange={v => setEdition({ ...edition, formateur: v })} options={ref.formateurs} vide="—" /></Champ>
                                <Champ libelle="Date"><input className="input" type="date" value={edition.date} onChange={e => setEdition({ ...edition, date: e.target.value })} /></Champ>
                                <Champ libelle="Heure de début"><input className="input" type="time" value={edition.heure} onChange={e => setEdition({ ...edition, heure: e.target.value })} /></Champ>
                                <Champ libelle="Durée (minutes)"><input className="input" type="number" min="0" step="5" value={edition.dureeMin} onChange={e => setEdition({ ...edition, dureeMin: e.target.value })} /></Champ>
                                <Champ libelle="Statut"><Choix valeur={edition.statut} onChange={v => setEdition({ ...edition, statut: v })} options={STATUTS_SESSION} /></Champ>
                            </div>
                            <div className="sec">Participants ({(edition.participants || []).length} inscrits · {(edition.presents || []).length} présents · {(edition.valides || []).length} acquis validés)</div>
                            {eligibles.length > 0 ? <>
                                <div className="actions" style={{ marginBottom: 8 }}>
                                    <button type="button" className="btn mini" onClick={() => setEdition({ ...edition, participants: eligibles.map(c => c.id) })}>Inscrire tous</button>
                                    <button type="button" className="btn mini" onClick={() => setEdition({ ...edition, presents: [...(edition.participants || [])] })}>Tous les inscrits présents</button>
                                    <button type="button" className="btn mini" onClick={() => setEdition({ ...edition, valides: [...(edition.presents || [])] })}>Valider tous les présents</button>
                                </div>
                                <div className="liste-part"><table className="tab">
                                    <thead><tr><th>Conseiller</th><th className="centre">Inscrit</th><th className="centre">Présent</th><th className="centre">Acquis validés</th></tr></thead>
                                    <tbody>{eligibles.map(c => <tr key={c.id}><td>{c.nom} <span style={{ color: 'var(--encre-3)', fontSize: 11 }}>{c.equipe}</span></td>
